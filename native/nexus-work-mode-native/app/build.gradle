plugins {
    id 'com.android.application'
}

android {
    namespace 'tech.nosmo.nexus.workmode'
    compileSdk 35

    defaultConfig {
        applicationId 'tech.nosmo.nexus.workmode'
        minSdk 26
        targetSdk 35
        versionCode 8
        versionName '0.4.0-native'
    }

    buildTypes {
        debug {
            applicationIdSuffix '.diagnostic'
            versionNameSuffix '-diagnostic'
        }
        release {
            minifyEnabled false
            shrinkResources false
        }
    }
}
