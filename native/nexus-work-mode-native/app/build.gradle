plugins {
    id 'com.android.application'
}

android {
    namespace 'tech.nosmo.nexus.workmode'
    compileSdk 35

    defaultConfig {
        applicationId 'tech.nosmo.nexus.workmode'
        minSdk 26
        targetSdk 35
        versionCode 11
        versionName '0.5.1-native'
    }

    signingConfigs {
        nexusTest {
            storeFile file('../signing/nexus-test.keystore')
            storePassword 'nexusworkmode'
            keyAlias 'nexus-test'
            keyPassword 'nexusworkmode'
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.native'
            versionNameSuffix '-test'
            signingConfig signingConfigs.nexusTest
        }
        release {
            minifyEnabled false
            shrinkResources false
        }
    }
}
