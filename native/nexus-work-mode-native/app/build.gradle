plugins {
    id 'com.android.application'
}

def nexusWebOrigin = (System.getenv('NEXUS_ANDROID_WEB_ORIGIN') ?: '').trim()
def escapedNexusWebOrigin = nexusWebOrigin.replace('\\', '\\\\').replace('"', '\\"')

android {
    namespace 'tech.nosmo.nexus.workmode'
    compileSdk 35

    defaultConfig {
        applicationId 'tech.nosmo.nexus.workmode'
        minSdk 26
        targetSdk 35
        versionCode 17
        versionName '0.7.0-worker-home'
        buildConfigField 'String', 'NEXUS_WEB_ORIGIN', "\"${escapedNexusWebOrigin}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            // Dedicated install-safe package for the Worker Home visual/device smoke.
            // This avoids collisions with earlier ephemeral CI debug signatures.
            applicationIdSuffix '.workerhome'
            versionNameSuffix '-preview'
        }
        release {
            minifyEnabled false
            shrinkResources false
        }
    }
}
