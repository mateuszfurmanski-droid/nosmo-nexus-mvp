plugins {
    id 'com.android.application'
}

android {
    namespace 'tech.nosmo.nexus.workmode'
    compileSdk 35

    defaultConfig {
        applicationId 'tech.nosmo.nexus.workmode'
        minSdk 26
        targetSdk 35
        versionCode 16
        versionName '0.6.0-e2e-handoff'
    }

    buildTypes {
        debug {
            applicationIdSuffix '.nativebeta'
            versionNameSuffix '-beta'
        }
        release {
            minifyEnabled false
            shrinkResources false
        }
    }
}
