name: Run native pinch fix

on:
  push:
    branches: [main]
    paths:
      - .github/pinch-zoom-trigger.txt

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/persistent-project-graph
          fetch-depth: 0

      - name: Replace pointer pinch with native touch pinch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('artifacts/nosmo-nexus/src/components/persistent-workspace.tsx')
          text = path.read_text(encoding='utf-8')

          text = text.replace(
            '  type PointerEvent as ReactPointerEvent,\n  type WheelEvent as ReactWheelEvent,',
            '  type PointerEvent as ReactPointerEvent,\n  type TouchEvent as ReactTouchEvent,\n  type WheelEvent as ReactWheelEvent,',
            1,
          )

          old_refs = '''  const [pan, setPan] = useState({ x: 0, y: 0 });
  const [panDrag, setPanDrag] = useState<PanDrag | null>(null);
  const activePointersRef = useRef(new Map<number, Point>());
  const pinchRef = useRef<PinchGesture | null>(null);
  const suppressTouchRef = useRef(false);
  const containerRef = useRef<HTMLDivElement>(null);'''
          new_refs = '''  const [pan, setPan] = useState({ x: 0, y: 0 });
  const [panDrag, setPanDrag] = useState<PanDrag | null>(null);
  const touchPanRef = useRef<PanDrag | null>(null);
  const pinchRef = useRef<PinchGesture | null>(null);
  const didPinchRef = useRef(false);
  const containerRef = useRef<HTMLDivElement>(null);'''
          if old_refs not in text:
              raise SystemExit('gesture refs block not found')
          text = text.replace(old_refs, new_refs, 1)

          start = text.index('  const readPinch = () => {')
          end = text.index('\n  const wheel = (event: ReactWheelEvent<HTMLDivElement>) => {', start)
          new_handlers = '''  const readTouches = (touches: TouchList) => {
    if (touches.length < 2) return null;
    const first = touches.item(0);
    const second = touches.item(1);
    if (!first || !second) return null;
    return {
      distance: Math.hypot(second.clientX - first.clientX, second.clientY - first.clientY),
      midpoint: {
        x: (first.clientX + second.clientX) / 2,
        y: (first.clientY + second.clientY) / 2,
      },
    };
  };

  const beginPan = (event: ReactPointerEvent<HTMLDivElement>) => {
    if (event.pointerType === "touch") return;
    if ((event.target as HTMLElement).closest("[data-node], [data-control]")) return;
    event.currentTarget.setPointerCapture(event.pointerId);
    setPanDrag({ clientX: event.clientX, clientY: event.clientY, x: pan.x, y: pan.y });
  };

  const movePan = (event: ReactPointerEvent<HTMLDivElement>) => {
    if (event.pointerType === "touch" || !panDrag) return;
    setPan({ x: panDrag.x + event.clientX - panDrag.clientX, y: panDrag.y + event.clientY - panDrag.clientY });
  };

  const endPan = (event: ReactPointerEvent<HTMLDivElement>) => {
    if (event.pointerType === "touch") return;
    setPanDrag(null);
  };

  const beginTouch = (event: ReactTouchEvent<HTMLDivElement>) => {
    const target = event.target as HTMLElement;
    if (target.closest("[data-control]")) return;

    if (event.touches.length >= 2) {
      const gesture = readTouches(event.touches);
      if (!gesture) return;
      const safeZoom = Math.max(zoom, 0.001);
      didPinchRef.current = true;
      pinchRef.current = {
        distance: Math.max(gesture.distance, 1),
        midpoint: gesture.midpoint,
        zoom: safeZoom,
        worldPoint: {
          x: (gesture.midpoint.x - size.w / 2 - pan.x) / safeZoom,
          y: (gesture.midpoint.y - size.h / 2 - pan.y) / safeZoom,
        },
      };
      touchPanRef.current = null;
      setPanDrag(null);
      event.preventDefault();
      event.stopPropagation();
      return;
    }

    if (event.touches.length === 1 && !target.closest("[data-node]")) {
      const touch = event.touches.item(0);
      if (touch) {
        touchPanRef.current = {
          clientX: touch.clientX,
          clientY: touch.clientY,
          x: pan.x,
          y: pan.y,
        };
      }
    }
  };

  const moveTouch = (event: ReactTouchEvent<HTMLDivElement>) => {
    if (event.touches.length >= 2) {
      const gesture = readTouches(event.touches);
      let start = pinchRef.current;

      if (gesture && !start) {
        const safeZoom = Math.max(zoom, 0.001);
        didPinchRef.current = true;
        start = {
          distance: Math.max(gesture.distance, 1),
          midpoint: gesture.midpoint,
          zoom: safeZoom,
          worldPoint: {
            x: (gesture.midpoint.x - size.w / 2 - pan.x) / safeZoom,
            y: (gesture.midpoint.y - size.h / 2 - pan.y) / safeZoom,
          },
        };
        pinchRef.current = start;
        touchPanRef.current = null;
      }

      if (gesture && start) {
        const nextZoom = clampZoom(start.zoom * gesture.distance / start.distance);
        setZoom(nextZoom);
        setPan({
          x: gesture.midpoint.x - size.w / 2 - start.worldPoint.x * nextZoom,
          y: gesture.midpoint.y - size.h / 2 - start.worldPoint.y * nextZoom,
        });
      }

      event.preventDefault();
      event.stopPropagation();
      return;
    }

    if (didPinchRef.current) {
      event.preventDefault();
      event.stopPropagation();
      return;
    }

    const touch = event.touches.item(0);
    const start = touchPanRef.current;
    if (event.touches.length === 1 && touch && start) {
      setPan({
        x: start.x + touch.clientX - start.clientX,
        y: start.y + touch.clientY - start.clientY,
      });
      event.preventDefault();
    }
  };

  const endTouch = (event: ReactTouchEvent<HTMLDivElement>) => {
    const wasPinching = didPinchRef.current;
    if (event.touches.length < 2) pinchRef.current = null;
    if (event.touches.length === 0) {
      touchPanRef.current = null;
      didPinchRef.current = false;
    } else if (wasPinching) {
      touchPanRef.current = null;
    }

    if (wasPinching) {
      event.preventDefault();
      event.stopPropagation();
    }
  };
'''
          text = text[:start] + new_handlers + text[end:]

          old_props = '''      onPointerDownCapture={beginPan}
      onPointerMoveCapture={movePan}
      onPointerUpCapture={endPan}
      onPointerCancelCapture={endPan}
      onWheel={wheel}'''
          new_props = '''      onPointerDown={beginPan}
      onPointerMove={movePan}
      onPointerUp={endPan}
      onPointerCancel={endPan}
      onTouchStartCapture={beginTouch}
      onTouchMoveCapture={moveTouch}
      onTouchEndCapture={endTouch}
      onTouchCancelCapture={endTouch}
      onWheel={wheel}'''
          if old_props not in text:
              raise SystemExit('root event props not found')
          text = text.replace(old_props, new_props, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit native pinch fix
        shell: bash
        run: |
          git config user.name 'NOSMO Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add artifacts/nosmo-nexus/src/components/persistent-workspace.tsx
          git commit -m 'Use native two-finger touch zoom on mobile'
          git push origin HEAD:agent/persistent-project-graph
