name: Build Graph Preview

on:
  push:
    branches:
      - agent/persistent-project-graph
  pull_request:
    branches:
      - agent/nexus-v1-project-shell
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-preview:
    if: github.event_name != 'pull_request' || github.head_ref == 'agent/persistent-project-graph'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}

      - name: Refine project-centred animated timeline
        if: github.event_name == 'push'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('artifacts/nosmo-nexus/src/components/persistent-workspace.tsx')
          text = path.read_text(encoding='utf-8')

          replacements = [
            ('const FLOW = { type: "tween" as const, duration: 0.85, ease: [0.22, 1, 0.36, 1] as const };',
             'const FLOW = { type: "tween" as const, duration: 1, ease: [0.22, 1, 0.36, 1] as const };'),
            ('const [timelineEnabled, setTimelineEnabled] = useState(true);',
             'const [timelineEnabled, setTimelineEnabled] = useState(false);'),
            ('const layoutCentreId = timelineEnabled ? PROJECT_ID : selectedId;',
             'const layoutCentreId = PROJECT_ID;'),
            ('    setTimelineEnabled(true);',
             '    setTimelineEnabled(false);'),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Missing required anchor: {old}')
              text = text.replace(old, new, 1)

          old_toolbar = '''        <button
          type="button"
          onClick={() => setTimelineEnabled((value) => !value)}
          className={`inline-flex items-center gap-1.5 rounded-xl px-2.5 py-2 text-[10px] font-bold uppercase tracking-[.1em] ${timelineEnabled ? "bg-primary/15 text-primary" : "text-muted-foreground hover:bg-secondary"}`}
          aria-pressed={timelineEnabled}
          title="Newest received documents sit farther from the project centre"
        >
          <Clock3 className="h-4 w-4" /> Timeline {timelineEnabled ? "On" : "Off"}
        </button>
        <span className="ml-1 text-[10px] font-bold uppercase tracking-[.11em] text-muted-foreground">{NODES.length} objects · {edges.length} links · {Math.round(zoom * 100)}%</span>
      </div>

      <button
        data-control
        type="button"
        onClick={() => setMode("workflow")}
        className="absolute right-3 top-3 z-50 inline-flex items-center gap-2 rounded-full border border-border bg-background/90 px-4 py-2 text-xs font-semibold text-muted-foreground shadow-xl backdrop-blur-xl hover:text-foreground"
      >
        <Workflow className="h-4 w-4" /> Workflow mode
      </button>'''
          new_toolbar = '''        <button
          type="button"
          onClick={() => setTimelineEnabled((value) => !value)}
          className={`inline-flex items-center gap-1.5 rounded-xl px-2.5 py-2 text-[10px] font-bold uppercase tracking-[.1em] ${timelineEnabled ? "bg-primary/15 text-primary" : "text-muted-foreground hover:bg-secondary"}`}
          aria-pressed={timelineEnabled}
          title="Animate received documents outward by time"
        >
          <Clock3 className="h-4 w-4" /> Timeline {timelineEnabled ? "On" : "Off"}
        </button>
        <button
          type="button"
          onClick={() => setMode("workflow")}
          className="inline-flex items-center gap-1.5 rounded-xl px-2.5 py-2 text-[10px] font-bold uppercase tracking-[.1em] text-muted-foreground hover:bg-secondary hover:text-foreground"
          title="Open workflow view"
        >
          <Workflow className="h-4 w-4" /> Workflow
        </button>
        <span className="ml-1 text-[10px] font-bold uppercase tracking-[.11em] text-muted-foreground">{NODES.length} objects · {edges.length} links · {Math.round(zoom * 100)}%</span>
      </div>'''
          if old_toolbar not in text:
              raise SystemExit('Toolbar anchor missing')
          text = text.replace(old_toolbar, new_toolbar, 1)

          old_ring = '''          {timelineEnabled && timelineRings.map((ring, index) => (
            <g key={`timeline-ring-${index}`}>'''
          new_ring = '''          {timelineRings.map((ring, index) => (
            <motion.g
              key={`timeline-ring-${index}`}
              initial={false}
              animate={{ opacity: timelineEnabled ? 1 : 0 }}
              transition={{ duration: 0.35, delay: timelineEnabled ? index * 0.06 : 0 }}
            >'''
          if old_ring not in text:
              raise SystemExit('Timeline ring anchor missing')
          text = text.replace(old_ring, new_ring, 1)
          if '            </g>\n          ))}' not in text:
              raise SystemExit('Timeline ring close anchor missing')
          text = text.replace('            </g>\n          ))}', '            </motion.g>\n          ))}', 1)

          text = text.replace('                onDoubleClick={() => setMode("workflow")}\n', '', 1)
          text = text.replace(
            '{timelineEnabled ? "Timeline: newer received documents sit farther out · drag documents freely; on release they settle onto their time radius" : "Free layout: drag tiles to arrange · chain icon connects any two objects · click changes focus without hiding anything"}',
            '{timelineEnabled ? "Timeline: documents animate outward by received time · newest = farthest from the project" : "Project stays centred · click highlights relationships · drag tiles freely · Timeline animates document recency"}',
            1,
          )

          required = [
            'const layoutCentreId = PROJECT_ID;',
            'const [timelineEnabled, setTimelineEnabled] = useState(false);',
            '<motion.g',
            '<Workflow className="h-4 w-4" /> Workflow',
          ]
          for marker in required:
              if marker not in text:
                  raise SystemExit(f'Missing final marker: {marker}')
          if 'onDoubleClick={() => setMode("workflow")}' in text:
              raise SystemExit('Double-click workflow shortcut still present')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck workspace
        run: pnpm run typecheck

      - name: Build graph preview
        env:
          PORT: 4173
          BASE_PATH: /apps/nexus-graph-preview/
        run: pnpm --filter @workspace/nosmo-nexus build

      - name: Add stable relationship-tree entry
        shell: bash
        run: |
          mkdir -p artifacts/nosmo-nexus/dist/public/relationship-tree
          cp artifacts/nosmo-nexus/dist/public/index.html artifacts/nosmo-nexus/dist/public/relationship-tree/index.html
          python - <<'PY'
          from pathlib import Path
          target = Path('artifacts/nosmo-nexus/dist/public/relationship-tree/index.html')
          html = target.read_text(encoding='utf-8')
          route = '<script>history.replaceState(null,"","/apps/nexus-graph-preview/relationship-tree");</script>'
          target.write_text(html.replace('</head>', route + '\n</head>'), encoding='utf-8')
          PY

      - name: Upload graph preview
        uses: actions/upload-artifact@v4
        with:
          name: nexus-graph-preview
          path: artifacts/nosmo-nexus/dist/public
          if-no-files-found: error
          retention-days: 14

      - name: Commit product refinement and restore workflow
        if: github.event_name == 'push'
        shell: bash
        run: |
          git show HEAD^:.github/workflows/build-graph-preview.yml > .github/workflows/build-graph-preview.yml
          git config user.name "NOSMO Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add artifacts/nosmo-nexus/src/components/persistent-workspace.tsx .github/workflows/build-graph-preview.yml
          git commit -m "Refine project-centred animated timeline"
          git push origin HEAD:agent/persistent-project-graph
