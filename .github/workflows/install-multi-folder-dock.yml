name: Install multi folder dock

on:
  pull_request:
    branches:
      - agent/nexus-v1-project-shell

permissions:
  contents: write

jobs:
  install-folder-dock:
    if: github.head_ref == 'agent/persistent-project-graph'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout graph branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Connect folder dock to persistent workspace
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('artifacts/nosmo-nexus/src/components/persistent-workspace.tsx')
          text = path.read_text(encoding='utf-8')

          import_marker = 'import InteractiveWorkspace from "./interactive-workspace";'
          folder_import = 'import FolderDock from "./folder-dock";'
          if folder_import not in text:
              if import_marker not in text:
                  raise SystemExit('InteractiveWorkspace import marker not found')
              text = text.replace(import_marker, import_marker + '\n' + folder_import, 1)

          text = text.replace('  Workflow,\n  X,\n} from "lucide-react";', '  Workflow,\n} from "lucide-react";', 1)

          start_marker = '      {selected && (\n'
          next_marker = '      <div data-control className="absolute bottom-3 left-3 z-40 hidden'
          start = text.find(start_marker)
          end = text.find(next_marker, start)
          if start >= 0 and end >= 0:
              replacement = '      <FolderDock\n        selected={selected}\n        selectedLinks={selectedLinks}\n        onOpenWorkflow={() => setMode("workflow")}\n      />\n\n'
              text = text[:start] + replacement + text[end:]
          elif '<FolderDock' not in text:
              raise SystemExit('Selected panel markers not found')

          helper = '''      <div data-control className="absolute bottom-3 left-3 z-40 hidden rounded-xl border border-border bg-background/72 px-3 py-2 text-[10px] text-muted-foreground backdrop-blur md:block">
        Drag tiles to arrange · chain icon connects any two objects · click changes focus without hiding anything
      </div>
'''
          text = text.replace(helper, '', 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit dock integration
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Folder dock already integrated."
            exit 0
          fi
          git config user.name "NOSMO Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add artifacts/nosmo-nexus/src/components/persistent-workspace.tsx
          git commit -m "Replace selected panel with multi-open folder dock"
          git push origin HEAD:${{ github.head_ref }}
