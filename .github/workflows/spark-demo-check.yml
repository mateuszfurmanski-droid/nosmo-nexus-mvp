name: Spark Demo Core Check

on:
  push:
    branches:
      - codex/spark-skanska-demo-core
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spark-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck Nexus web application
        run: pnpm --filter @workspace/nosmo-nexus typecheck

      - name: Build Nexus web application
        env:
          BASE_PATH: /
        run: pnpm --filter @workspace/nosmo-nexus build

      - name: Verify Spark demo is in build output
        run: |
          test -f artifacts/nosmo-nexus/dist/public/index.html
          grep -R --quiet "Spark Demo Core" artifacts/nosmo-nexus/dist/public

      - name: Upload exact Spark demo build
        uses: actions/upload-artifact@v4
        with:
          name: spark-demo-build
          path: artifacts/nosmo-nexus/dist/public
          if-no-files-found: error
          retention-days: 7

      - name: Smoke test direct Spark demo route
        env:
          PORT: 3000
        run: |
          pnpm --filter @workspace/scripts serve-nexus > /tmp/spark-demo-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; cat /tmp/spark-demo-server.log' EXIT

          ready=0
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/health > /dev/null; then
              ready=1
              break
            fi
            sleep 0.5
          done

          test "$ready" = "1"
          curl --fail --silent --show-error http://127.0.0.1:3000/spark-skanska-demo > /tmp/spark-demo.html
          grep --quiet '<div id="root"></div>' /tmp/spark-demo.html
