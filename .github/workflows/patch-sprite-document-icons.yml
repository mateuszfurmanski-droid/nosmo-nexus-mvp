name: Patch sprite document icons

# Registered and triggered for the current graph branch.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-sprite-document-icons.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/persistent-project-graph
          fetch-depth: 0

      - name: Connect sprite icons to document nodes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('artifacts/nosmo-nexus/src/components/persistent-workspace.tsx')
          text = path.read_text(encoding='utf-8')

          marker = 'const edgeId = (a: string, b: string) => [a, b].sort().join("|");\n'
          helper = '''const edgeId = (a: string, b: string) => [a, b].sort().join("|");

const FILE_ICON_SPRITE = "/assets/file-icons/nosmo-file-icons-sprite.png";
const FILE_ICON_POSITIONS: Record<string, string> = {
  pdf: "0% 0%", docx: "50% 0%", doc: "50% 0%", xlsx: "100% 0%", xls: "100% 0%",
  pptx: "0% 50%", ppt: "0% 50%", txt: "50% 50%", zip: "100% 50%", rar: "100% 50%", "7z": "100% 50%",
  jpg: "0% 100%", jpeg: "0% 100%", png: "0% 100%", webp: "0% 100%",
  mp4: "50% 100%", mov: "50% 100%", avi: "50% 100%", csv: "100% 100%",
};

function getDocumentExtension(node: WorkspaceNode) {
  const source = `${node.label} ${node.sublabel}`.toLowerCase();
  const explicit = source.match(/\b(pdf|docx?|xlsx?|pptx?|txt|zip|rar|7z|jpe?g|png|webp|mp4|mov|avi|csv)\b/);
  return explicit?.[1] ?? "txt";
}

function FileFormatIcon({ node, large = false, compact = false }: { node: WorkspaceNode; large?: boolean; compact?: boolean }) {
  const extension = getDocumentExtension(node);
  const position = FILE_ICON_POSITIONS[extension] ?? FILE_ICON_POSITIONS.txt;
  const sizeClass = compact ? "h-10 w-10" : large ? "h-16 w-16" : "h-12 w-12";
  return (
    <span
      aria-label={`${extension.toUpperCase()} file`}
      className={`${sizeClass} block shrink-0 bg-no-repeat drop-shadow-[0_6px_12px_rgba(0,0,0,.35)]`}
      style={{ backgroundImage: `url(${FILE_ICON_SPRITE})`, backgroundPosition: position, backgroundSize: "300% 300%" }}
    />
  );
}
'''
          if 'function FileFormatIcon' not in text:
              if marker not in text: raise SystemExit('edge marker not found')
              text = text.replace(marker, helper, 1)

          old = '''                  <span className={`flex items-center justify-center rounded-xl ${style.chip} ${selectedNode ? "h-14 w-14" : "h-10 w-10"}`}>
                    <Icon className={selectedNode ? "h-7 w-7" : "h-5 w-5"} />
                  </span>'''
          new = '''                  {node.type === "document" ? (
                    <FileFormatIcon node={node} large={selectedNode} />
                  ) : (
                    <span className={`flex items-center justify-center rounded-xl ${style.chip} ${selectedNode ? "h-14 w-14" : "h-10 w-10"}`}>
                      <Icon className={selectedNode ? "h-7 w-7" : "h-5 w-5"} />
                    </span>
                  )}'''
          if old in text: text = text.replace(old, new, 1)
          elif '<FileFormatIcon node={node}' not in text: raise SystemExit('node icon block not found')

          old_selected = '''            <div className={`flex h-11 w-11 shrink-0 items-center justify-center rounded-xl ${TYPE_STYLE[selected.type].chip}`}><selected.Icon className="h-5 w-5" /></div>'''
          new_selected = '''            <div className={`flex h-11 w-11 shrink-0 items-center justify-center rounded-xl ${selected.type === "document" ? "" : TYPE_STYLE[selected.type].chip}`}>
              {selected.type === "document" ? <FileFormatIcon node={selected} compact /> : <selected.Icon className="h-5 w-5" />}
            </div>'''
          if old_selected in text: text = text.replace(old_selected, new_selected, 1)
          elif '<FileFormatIcon node={selected}' not in text: raise SystemExit('selected icon block not found')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit graph patch
        shell: bash
        run: |
          if ! git diff --quiet; then
            git config user.name "NOSMO Build Bot"
            git config user.email "actions@users.noreply.github.com"
            git add artifacts/nosmo-nexus/src/components/persistent-workspace.tsx
            git commit -m "Use sprite icons for document nodes"
            git push origin HEAD:agent/persistent-project-graph
          fi

      - name: Remove temporary workflow
        shell: bash
        run: |
          git fetch origin main
          git checkout -B main origin/main
          rm -f .github/workflows/patch-sprite-document-icons.yml
          git config user.name "NOSMO Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Remove one-time sprite icon workflow"
            git push origin HEAD:main
          fi
