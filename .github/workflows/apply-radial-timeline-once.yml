name: Apply Radial Timeline Once

on:
  push:
    branches:
      - agent/persistent-project-graph
    paths:
      - .github/workflows/apply-radial-timeline-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout persistent graph
        uses: actions/checkout@v4
        with:
          ref: agent/persistent-project-graph

      - name: Apply radial received-document timeline
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          data_path = Path('artifacts/nosmo-nexus/src/components/workspace-data.ts')
          data = data_path.read_text(encoding='utf-8')

          old_interface = '''  /** Organisation a person belongs to — drives company grouping in the layout. */
  company?: string;
}'''
          new_interface = '''  /** Organisation a person belongs to — drives company grouping in the layout. */
  company?: string;
  /** When Nexus received this object. Radial Timeline uses this for document distance from project centre. */
  receivedAt?: string;
  /** Date carried by the document itself; intentionally separate from receivedAt. */
  documentDate?: string;
}'''
          if old_interface not in data:
              raise SystemExit('WorkspaceNode interface anchor not found')
          data = data.replace(old_interface, new_interface, 1)

          replacements = {
            '{ id: "d-groundfloor", label: "Ground Floor Plans", sublabel: "PDF", type: "document", Icon: PdfFileIcon },': '{ id: "d-groundfloor", label: "Ground Floor Plans", sublabel: "PDF", type: "document", Icon: PdfFileIcon, receivedAt: "2026-07-08T09:20:00Z", documentDate: "2026-06-30" },',
            '{ id: "d-doorschedule", label: "Door Schedule", sublabel: "XLSX", type: "document", Icon: XlsxFileIcon },': '{ id: "d-doorschedule", label: "Door Schedule", sublabel: "XLSX", type: "document", Icon: XlsxFileIcon, receivedAt: "2026-07-16T13:45:00Z", documentDate: "2026-07-10" },',
            '{ id: "d-siteinstructions", label: "Site Instructions", sublabel: "PDF", type: "document", Icon: PdfFileIcon },': '{ id: "d-siteinstructions", label: "Site Instructions", sublabel: "PDF", type: "document", Icon: PdfFileIcon, receivedAt: "2026-07-25T07:35:00Z", documentDate: "2026-07-24" },',
            '{ id: "d-firecerts", label: "Fire Door Certificates", sublabel: "PDF", type: "document", Icon: PdfFileIcon },': '{ id: "d-firecerts", label: "Fire Door Certificates", sublabel: "PDF", type: "document", Icon: PdfFileIcon, receivedAt: "2026-08-02T15:10:00Z", documentDate: "2026-07-31" },',
            '{ id: "d-snaglist", label: "Snag List", sublabel: "XLSX", type: "document", Icon: XlsxFileIcon },': '{ id: "d-snaglist", label: "Snag List", sublabel: "XLSX", type: "document", Icon: XlsxFileIcon, receivedAt: "2026-08-08T10:05:00Z", documentDate: "2026-08-08" },',
          }
          for old, new in replacements.items():
              if old not in data:
                  raise SystemExit(f'Document node anchor not found: {old[:40]}')
              data = data.replace(old, new, 1)
          data_path.write_text(data, encoding='utf-8')

          path = Path('artifacts/nosmo-nexus/src/components/persistent-workspace.tsx')
          text = path.read_text(encoding='utf-8')

          old_import = '''  ArrowLeft,
  Link2,
  Maximize2,'''
          new_import = '''  ArrowLeft,
  Clock3,
  Link2,
  Maximize2,'''
          if old_import not in text:
              raise SystemExit('Lucide import anchor not found')
          text = text.replace(old_import, new_import, 1)

          old_constants = '''const FLOW = { type: "tween" as const, duration: 0.85, ease: [0.22, 1, 0.36, 1] as const };
const edgeId = (a: string, b: string) => [a, b].sort().join("|");
const clampZoom = (value: number) => Math.min(1.3, Math.max(0.3, value));'''
          new_constants = '''const FLOW = { type: "tween" as const, duration: 0.85, ease: [0.22, 1, 0.36, 1] as const };
const edgeId = (a: string, b: string) => [a, b].sort().join("|");
const clampZoom = (value: number) => Math.min(1.3, Math.max(0.3, value));
const TIMELINE_INNER_RADIUS = 285;
const TIMELINE_OUTER_RADIUS = 760;
const TIMELINE_RING_COUNT = 4;

function documentReceivedTime(node: WorkspaceNode) {
  if (node.type !== "document" || !node.receivedAt) return null;
  const value = Date.parse(node.receivedAt);
  return Number.isFinite(value) ? value : null;
}

function documentTimelineDomain(nodes: WorkspaceNode[]) {
  const values = nodes.map(documentReceivedTime).filter((value): value is number => value !== null);
  if (!values.length) return null;
  return { min: Math.min(...values), max: Math.max(...values) };
}

function timelineRadius(node: WorkspaceNode, domain: { min: number; max: number } | null) {
  const received = documentReceivedTime(node);
  if (received === null || !domain) return null;
  const span = Math.max(1, domain.max - domain.min);
  const progress = (received - domain.min) / span;
  return TIMELINE_INNER_RADIUS + progress * (TIMELINE_OUTER_RADIUS - TIMELINE_INNER_RADIUS);
}

function pointOnRadius(point: Point, radius: number, fallbackAngle: number) {
  const distance = Math.hypot(point.x, point.y);
  const angle = distance > 1 ? Math.atan2(point.y, point.x) : fallbackAngle;
  return { x: Math.cos(angle) * radius, y: Math.sin(angle) * radius };
}

function formatReceivedAt(value?: string) {
  if (!value) return "Received date unavailable";
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return "Received date unavailable";
  return `Received ${date.toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" })}`;
}'''
          if old_constants not in text:
              raise SystemExit('Constants anchor not found')
          text = text.replace(old_constants, new_constants, 1)

          old_signature = '''function calculateLayout(
  nodes: WorkspaceNode[],
  selectedId: string,
  edges: Edge[],
  pinned: Record<string, Point>,
) {'''
          new_signature = '''function calculateLayout(
  nodes: WorkspaceNode[],
  selectedId: string,
  edges: Edge[],
  pinned: Record<string, Point>,
  timelineEnabled: boolean,
  draggingNodeId: string | null,
) {'''
          if old_signature not in text:
              raise SystemExit('calculateLayout signature anchor not found')
          text = text.replace(old_signature, new_signature, 1)

          old_layout_end = '''  Object.entries(pinned).forEach(([id, point]) => {
    if (id !== selected?.id && positions.has(id)) positions.set(id, point);
  });
  return positions;
}'''
          new_layout_end = '''  Object.entries(pinned).forEach(([id, point]) => {
    if (id !== selected?.id && positions.has(id)) positions.set(id, point);
  });

  if (timelineEnabled) {
    const domain = documentTimelineDomain(nodes);
    nodes.forEach((node) => {
      if (node.type !== "document" || node.id === draggingNodeId) return;
      const radius = timelineRadius(node, domain);
      const point = positions.get(node.id);
      if (radius === null || !point) return;
      positions.set(node.id, pointOnRadius(point, radius, seededAngle(node.id)));
    });
  }
  return positions;
}'''
          if old_layout_end not in text:
              raise SystemExit('calculateLayout end anchor not found')
          text = text.replace(old_layout_end, new_layout_end, 1)

          old_state = '''  const [zoom, setZoom] = useState(typeof window !== "undefined" && window.innerWidth < 720 ? 0.52 : 0.72);
  const [pan, setPan] = useState({ x: 0, y: 0 });
  const [draggingNodeId, setDraggingNodeId] = useState<string | null>(null);'''
          new_state = '''  const [zoom, setZoom] = useState(typeof window !== "undefined" && window.innerWidth < 720 ? 0.52 : 0.72);
  const [pan, setPan] = useState({ x: 0, y: 0 });
  const [timelineEnabled, setTimelineEnabled] = useState(true);
  const [draggingNodeId, setDraggingNodeId] = useState<string | null>(null);'''
          if old_state not in text:
              raise SystemExit('state anchor not found')
          text = text.replace(old_state, new_state, 1)

          old_positions = '''  const positions = useMemo(
    () => calculateLayout(NODES, selectedId, edges, pinned),
    [selectedId, edges, pinned],
  );'''
          new_positions = '''  const layoutCentreId = timelineEnabled ? PROJECT_ID : selectedId;
  const timelineDomain = useMemo(() => documentTimelineDomain(NODES), []);
  const timelineRings = useMemo(() => {
    if (!timelineDomain) return [];
    return Array.from({ length: TIMELINE_RING_COUNT }, (_, index) => {
      const progress = index / Math.max(1, TIMELINE_RING_COUNT - 1);
      const radius = TIMELINE_INNER_RADIUS + progress * (TIMELINE_OUTER_RADIUS - TIMELINE_INNER_RADIUS);
      const at = timelineDomain.min + progress * (timelineDomain.max - timelineDomain.min);
      return { radius, at };
    });
  }, [timelineDomain]);
  const positions = useMemo(
    () => calculateLayout(NODES, layoutCentreId, edges, pinned, timelineEnabled, draggingNodeId),
    [layoutCentreId, edges, pinned, timelineEnabled, draggingNodeId],
  );'''
          if old_positions not in text:
              raise SystemExit('positions anchor not found')
          text = text.replace(old_positions, new_positions, 1)

          old_reset = '''    setLinkSource(null);
    setPan({ x: 0, y: 0 });
    setZoom(typeof window !== "undefined" && window.innerWidth < 720 ? 0.52 : 0.72);'''
          new_reset = '''    setLinkSource(null);
    setPan({ x: 0, y: 0 });
    setTimelineEnabled(true);
    setZoom(typeof window !== "undefined" && window.innerWidth < 720 ? 0.52 : 0.72);'''
          if old_reset not in text:
              raise SystemExit('reset anchor not found')
          text = text.replace(old_reset, new_reset, 1)

          old_end = '''      const finalPoint = {
        x: gesture.point.x + deltaX / gesture.zoom,
        y: gesture.point.y + deltaY / gesture.zoom,
      };
      const next = { ...pinnedRef.current, [gesture.nodeId]: finalPoint };'''
          new_end = '''      let finalPoint = {
        x: gesture.point.x + deltaX / gesture.zoom,
        y: gesture.point.y + deltaY / gesture.zoom,
      };
      const draggedNode = byId.get(gesture.nodeId);
      if (timelineEnabled && draggedNode?.type === "document") {
        const radius = timelineRadius(draggedNode, timelineDomain);
        if (radius !== null) finalPoint = pointOnRadius(finalPoint, radius, seededAngle(draggedNode.id));
      }
      const next = { ...pinnedRef.current, [gesture.nodeId]: finalPoint };'''
          if old_end not in text:
              raise SystemExit('end gesture anchor not found')
          text = text.replace(old_end, new_end, 1)

          old_controls = '''        <button type="button" onClick={fit} className="rounded-xl p-2 text-muted-foreground hover:bg-secondary"><Maximize2 className="h-4 w-4" /></button>
        <button type="button" onClick={reset} className="rounded-xl p-2 text-muted-foreground hover:bg-secondary"><RotateCcw className="h-4 w-4" /></button>
        <span className="ml-1 text-[10px] font-bold uppercase tracking-[.11em] text-muted-foreground">{NODES.length} objects · {edges.length} links · {Math.round(zoom * 100)}%</span>'''
          new_controls = '''        <button type="button" onClick={fit} className="rounded-xl p-2 text-muted-foreground hover:bg-secondary"><Maximize2 className="h-4 w-4" /></button>
        <button type="button" onClick={reset} className="rounded-xl p-2 text-muted-foreground hover:bg-secondary"><RotateCcw className="h-4 w-4" /></button>
        <button
          type="button"
          onClick={() => setTimelineEnabled((value) => !value)}
          className={`inline-flex items-center gap-1.5 rounded-xl px-2.5 py-2 text-[10px] font-bold uppercase tracking-[.1em] ${timelineEnabled ? "bg-primary/15 text-primary" : "text-muted-foreground hover:bg-secondary"}`}
          aria-pressed={timelineEnabled}
          title="Newest received documents sit farther from the project centre"
        >
          <Clock3 className="h-4 w-4" /> Timeline {timelineEnabled ? "On" : "Off"}
        </button>
        <span className="ml-1 text-[10px] font-bold uppercase tracking-[.11em] text-muted-foreground">{NODES.length} objects · {edges.length} links · {Math.round(zoom * 100)}%</span>'''
          if old_controls not in text:
              raise SystemExit('controls anchor not found')
          text = text.replace(old_controls, new_controls, 1)

          old_world = '''      <div className="absolute left-0 top-0 h-0 w-0 origin-top-left" style={{ transform: world }}>
        <svg className="pointer-events-none absolute left-0 top-0 overflow-visible">
          {edges.map((edge) => {'''
          new_world = '''      <div className="absolute left-0 top-0 h-0 w-0 origin-top-left" style={{ transform: world }}>
        <svg className="pointer-events-none absolute left-0 top-0 overflow-visible">
          {timelineEnabled && timelineRings.map((ring, index) => (
            <g key={`timeline-ring-${index}`}>
              <circle
                cx={0}
                cy={0}
                r={ring.radius}
                fill="none"
                className={index === timelineRings.length - 1 ? "stroke-primary/28" : "stroke-border/28"}
                strokeWidth={index === timelineRings.length - 1 ? 1.6 : 1}
                strokeDasharray={index === timelineRings.length - 1 ? "8 7" : "4 8"}
              />
              <text
                x={10}
                y={-ring.radius + 18}
                className={index === timelineRings.length - 1 ? "fill-primary text-[11px] font-bold" : "fill-muted-foreground text-[10px] font-semibold"}
                opacity={index === timelineRings.length - 1 ? 0.8 : 0.55}
              >
                {index === timelineRings.length - 1 ? "NEWEST · " : ""}{new Date(ring.at).toLocaleDateString(undefined, { day: "numeric", month: "short" })}
              </text>
            </g>
          ))}
          {edges.map((edge) => {'''
          if old_world not in text:
              raise SystemExit('world anchor not found')
          text = text.replace(old_world, new_world, 1)

          old_meta = '''                <span className="rounded-full border border-border bg-background/80 px-2 py-0.5 text-[8px] font-bold uppercase tracking-[.12em] text-muted-foreground">{node.type}</span>'''
          new_meta = '''                <span className="rounded-full border border-border bg-background/80 px-2 py-0.5 text-[8px] font-bold uppercase tracking-[.12em] text-muted-foreground">{node.type}</span>
                {timelineEnabled && node.type === "document" && node.receivedAt && (
                  <span className="rounded-full border border-primary/20 bg-primary/10 px-2 py-0.5 text-[8px] font-semibold text-primary/80">{formatReceivedAt(node.receivedAt)}</span>
                )}'''
          if old_meta not in text:
              raise SystemExit('node meta anchor not found')
          text = text.replace(old_meta, new_meta, 1)

          old_selected = '''<p className="mt-1 text-xs text-muted-foreground">{selected.sublabel} · {selectedLinks} linked objects</p>'''
          new_selected = '''<p className="mt-1 text-xs text-muted-foreground">{selected.sublabel} · {selectedLinks} linked objects</p>{selected.type === "document" && selected.receivedAt && <p className="mt-1 text-xs font-medium text-primary">{formatReceivedAt(selected.receivedAt)}{selected.documentDate ? ` · document ${selected.documentDate}` : ""}</p>}'''
          if old_selected not in text:
              raise SystemExit('selected anchor not found')
          text = text.replace(old_selected, new_selected, 1)

          old_help = '        Drag tiles to arrange · chain icon connects any two objects · click changes focus without hiding anything'
          new_help = '        {timelineEnabled ? "Timeline: newer received documents sit farther out · drag documents freely; on release they settle onto their time radius" : "Free layout: drag tiles to arrange · chain icon connects any two objects · click changes focus without hiding anything"}'
          if old_help not in text:
              raise SystemExit('help anchor not found')
          text = text.replace(old_help, new_help, 1)

          invariants = [
            'const TIMELINE_INNER_RADIUS = 285;',
            'const [timelineEnabled, setTimelineEnabled] = useState(true);',
            'const layoutCentreId = timelineEnabled ? PROJECT_ID : selectedId;',
            'x: gesture.point.x + deltaX / gesture.zoom',
            'Timeline {timelineEnabled ? "On" : "Off"}',
          ]
          for invariant in invariants:
              if invariant not in text:
                  raise SystemExit(f'Missing invariant: {invariant}')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck workspace
        run: pnpm run typecheck

      - name: Build graph preview
        env:
          PORT: 4173
          BASE_PATH: /apps/nexus-graph-preview/
        run: pnpm --filter @workspace/nosmo-nexus build

      - name: Remove one-time workflow and commit product change
        shell: bash
        run: |
          rm .github/workflows/apply-radial-timeline-once.yml
          git config user.name "NOSMO Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add artifacts/nosmo-nexus/src/components/workspace-data.ts artifacts/nosmo-nexus/src/components/persistent-workspace.tsx .github/workflows/apply-radial-timeline-once.yml
          git commit -m "Add radial received-document timeline"
          git push origin HEAD:agent/persistent-project-graph
