name: Build Manager PR49 Preview

on:
  push:
    branches:
      - codex/manager-trade-shell-pr45
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Nexus for website preview subpath
        env:
          BASE_PATH: /apps/nexus-manager-preview/
        run: pnpm --filter @workspace/nosmo-nexus run build

      - name: Verify preview base path
        run: |
          grep -q '/apps/nexus-manager-preview/assets/' artifacts/nosmo-nexus/dist/public/index.html
          grep -q 'nexus-manager-preview' artifacts/nosmo-nexus/dist/public/index.html

      - name: Upload website-ready preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-manager-pr49-preview
          path: artifacts/nosmo-nexus/dist/public
          if-no-files-found: error
          retention-days: 14
