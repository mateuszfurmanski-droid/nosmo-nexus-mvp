name: Compact folder tiles

on:
  pull_request:
    branches:
      - agent/nexus-v1-project-shell

permissions:
  contents: write

jobs:
  compact-folder-tiles:
    if: github.head_ref == 'agent/persistent-project-graph'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout graph branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Replace full-width rows with compact tiles
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('artifacts/nosmo-nexus/src/components/folder-dock.tsx')
          text = path.read_text(encoding='utf-8')

          text = text.replace('  ChevronRight,\n', '', 1)
          text = text.replace('${isOpen ? "w-[220px]" : "w-[64px]"}', '${isOpen ? "w-[112px]" : "w-[64px]"}', 1)
          text = text.replace('w-[220px] flex-col', 'w-[112px] flex-col', 1)

          header_start = text.find('                    <header className="flex shrink-0 items-center gap-2')
          header_end = text.find('                    </header>', header_start)
          if header_start < 0 or header_end < 0:
              raise SystemExit('Folder header boundaries not found')
          header_end += len('                    </header>')
          new_header = '''                    <header className="flex shrink-0 flex-col gap-1.5 border-b border-border/80 px-2 py-2">
                      <div className="flex w-full items-center justify-between gap-1">
                        <span className="flex h-8 w-8 items-center justify-center rounded-xl bg-primary/15 text-primary">
                          <Icon className="h-4 w-4" />
                        </span>
                        <div className="flex items-center gap-0.5">
                          <button
                            type="button"
                            onClick={() => moveFolder(id, -1)}
                            disabled={order[0] === id}
                            className="rounded-lg p-1.5 text-muted-foreground hover:bg-secondary disabled:opacity-25"
                            aria-label={`Move ${folder.label} left`}
                          >
                            <ArrowLeft className="h-3.5 w-3.5" />
                          </button>
                          <button
                            type="button"
                            onClick={() => moveFolder(id, 1)}
                            disabled={order[order.length - 1] === id}
                            className="rounded-lg p-1.5 text-muted-foreground hover:bg-secondary disabled:opacity-25"
                            aria-label={`Move ${folder.label} right`}
                          >
                            <ArrowRight className="h-3.5 w-3.5" />
                          </button>
                        </div>
                      </div>
                      <p className="truncate text-center text-[10px] font-bold uppercase tracking-[.08em]">{folder.label}</p>
                    </header>'''
          text = text[:header_start] + new_header + text[header_end:]

          selection_start = text.find('                        <button\n                          type="button"\n                          onClick={onOpenWorkflow}')
          selection_end = text.find('                        </button>', selection_start)
          if selection_start < 0 or selection_end < 0:
              raise SystemExit('Current selection boundaries not found')
          selection_end += len('                        </button>')
          new_selection = '''                        <button
                          type="button"
                          onClick={onOpenWorkflow}
                          className="mx-auto mb-2 flex h-[72px] w-[86px] flex-col items-center justify-center rounded-xl border border-primary/30 bg-primary/10 px-2 py-2 text-center"
                        >
                          <p className="line-clamp-2 text-[10px] font-semibold leading-tight">{selected.label}</p>
                          <p className="mt-1 text-[8px] font-bold uppercase tracking-[.08em] text-primary">{selectedLinks} links</p>
                        </button>'''
          text = text[:selection_start] + new_selection + text[selection_end:]

          items_start = text.find('                      <div className="flex flex-col gap-2">')
          items_end_marker = '                      </div>\n                    </div>\n                  </section>'
          items_end = text.find(items_end_marker, items_start)
          if items_start < 0 or items_end < 0:
              raise SystemExit('Folder item boundaries not found')
          items_end += len('                      </div>')
          new_items = '''                      <div className="flex flex-col items-center gap-2">
                        {folder.items.map((item) => (
                          <button
                            key={item}
                            type="button"
                            className="group flex h-[72px] w-[86px] flex-none flex-col items-center justify-center gap-1.5 rounded-xl border border-border bg-card/78 px-2 py-2 text-center text-muted-foreground shadow-sm transition hover:border-primary/35 hover:bg-card hover:text-foreground active:scale-[.97]"
                          >
                            <span className="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg border border-border/70 bg-secondary/75 text-primary transition group-hover:border-primary/25 group-hover:bg-primary/10">
                              <Icon className="h-4 w-4" />
                            </span>
                            <span className="line-clamp-2 text-[10px] font-semibold leading-[1.05]">{item}</span>
                          </button>
                        ))}
                      </div>'''
          text = text[:items_start] + new_items + text[items_end:]

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit compact folder tiles
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Compact folder tiles already installed."
            exit 0
          fi
          git config user.name "NOSMO Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add artifacts/nosmo-nexus/src/components/folder-dock.tsx
          git commit -m "Compact folder menu tiles"
          git push origin HEAD:${{ github.head_ref }}
