name: NEXUS Work Package Database E2E

on:
  workflow_dispatch:
  pull_request:
    paths:
      - src/core/work-packages/**
      - lib/db/**
      - package.json
      - pnpm-lock.yaml
      - tsconfig.work-package-core.json
      - .github/workflows/nexus-work-package-db-e2e.yml

permissions:
  contents: read

jobs:
  real-postgres-work-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact tested SHA
        shell: bash
        run: |
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          echo "NEXUS_WORK_PACKAGE_DB_EXACT_HEAD=$actual"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck repository
        run: pnpm run typecheck

      - name: Create disposable PostgreSQL database
        env:
          PGPASSWORD: postgres
        run: createdb -h 127.0.0.1 -U postgres nexus_work_package_c2

      - name: Clean versioned migration and replay
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/nexus_work_package_c2
        run: |
          pnpm run db:migrate | tee /tmp/wp-migrate.log
          grep -q 'NEXUS_DB_MIGRATIONS_OK' /tmp/wp-migrate.log
          grep -q '0004_work_package_semantic_drop' /tmp/wp-migrate.log
          pnpm run db:migrate | tee /tmp/wp-migrate-replay.log
          grep -q '"appliedNow": \[\]' /tmp/wp-migrate-replay.log

      - name: Real PostgreSQL Work Package persistence smoke
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/nexus_work_package_c2
        run: |
          pnpm run smoke:work-package-db | tee /tmp/wp-db-smoke.log
          grep -q 'NEXUS_WORK_PACKAGE_DB_E2E_PASS' /tmp/wp-db-smoke.log
          grep -q '"concurrentRetry":true' /tmp/wp-db-smoke.log
          grep -q '"rollbackNoPartial":true' /tmp/wp-db-smoke.log

      - name: Prove remote migration gate fails closed
        shell: bash
        run: |
          set +e
          DATABASE_URL='postgresql://example:example@db.example.invalid:5432/nexus' pnpm run db:migrate > /tmp/remote-gate.log 2>&1
          exit_code=$?
          set -e
          test "$exit_code" -ne 0
          grep -q 'NEXUS_DB_MIGRATION_REMOTE_APPROVAL_REQUIRED' /tmp/remote-gate.log

      - name: Assert no push-force migration path exists
        shell: bash
        run: '! grep -R --line-number --fixed-strings "drizzle-kit push --force" lib/db package.json'
