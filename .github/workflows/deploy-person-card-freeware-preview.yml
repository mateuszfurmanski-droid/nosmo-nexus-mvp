name: Render Person Card Freeware Preview

on:
  push:
    branches:
      - codex/person-card-freeware
    paths:
      - "modules/person-card-freeware/index.html"
      - "modules/person-card-freeware/screen.html"
      - "modules/person-card-freeware/assets/**"
      - ".github/workflows/deploy-person-card-freeware-preview.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Freeware branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 --no-save
          npx playwright install --with-deps chromium

      - name: Serve Person Card Freeware
        shell: bash
        run: |
          cd modules/person-card-freeware
          python3 -m http.server 8128 >/tmp/person-card-preview.log 2>&1 &
          echo $! > /tmp/person-card-preview.pid
          sleep 2
          curl --fail http://127.0.0.1:8128/index.html >/dev/null

      - name: Render mobile Person Card
        shell: bash
        run: |
          mkdir -p modules/person-card-freeware/previews
          npx playwright screenshot             --browser chromium             --device "iPhone 13"             --full-page             http://127.0.0.1:8128/index.html             modules/person-card-freeware/previews/person-card-window.png

      - name: Commit preview if changed
        shell: bash
        run: |
          if git diff --quiet -- modules/person-card-freeware/previews/person-card-window.png && git ls-files --error-unmatch modules/person-card-freeware/previews/person-card-window.png >/dev/null 2>&1; then
            echo "Preview unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules/person-card-freeware/previews/person-card-window.png
          git commit -m "preview: render Person Card window"
          git push origin HEAD:codex/person-card-freeware

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: person-card-window-preview
          path: modules/person-card-freeware/previews/person-card-window.png
