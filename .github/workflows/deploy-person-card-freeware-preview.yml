name: Deploy Person Card Freeware Preview

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Freeware branch
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build current Nexus Pages root unchanged
        env:
          BASE_PATH: /nosmo-nexus-mvp/
        run: pnpm --filter @workspace/nosmo-nexus build

      - name: Add isolated Freeware preview route
        shell: bash
        run: |
          root=artifacts/nosmo-nexus/dist/public
          preview="$root/person-card-freeware-preview"
          rm -rf "$preview"
          mkdir -p "$preview"
          cp -R modules/person-card-freeware/. "$preview/"
          touch "$root/.nojekyll"
          test -f "$preview/index.html"
          test -f "$preview/work-mode-v2/privacy-connections.html"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: artifacts/nosmo-nexus/dist/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}person-card-freeware-preview/
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
