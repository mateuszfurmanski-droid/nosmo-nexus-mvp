name: Trigger Radial Timeline
# second push intentionally triggers the one-time workflow after it already exists on main

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/trigger-radial-timeline.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout persistent graph
        uses: actions/checkout@v4
        with:
          ref: agent/persistent-project-graph
          path: source

      - name: Execute embedded timeline patch
        shell: bash
        working-directory: source
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/apply-radial-timeline-once.yml')
          lines = workflow.read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == "python - <<'PY'") + 1
          end = next(i for i in range(start, len(lines)) if lines[i].strip() == 'PY')
          script_lines = []
          for line in lines[start:end]:
              script_lines.append(line[10:] if line.startswith('          ') else line.lstrip())
          script = '\n'.join(script_lines) + '\n'
          exec(compile(script, 'radial-timeline-embedded.py', 'exec'), {})
          PY

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: source
        run: pnpm install --frozen-lockfile

      - name: Typecheck workspace
        working-directory: source
        run: pnpm run typecheck

      - name: Build graph preview
        working-directory: source
        env:
          PORT: 4173
          BASE_PATH: /apps/nexus-graph-preview/
        run: pnpm --filter @workspace/nosmo-nexus build

      - name: Commit timeline to persistent graph
        working-directory: source
        shell: bash
        run: |
          rm .github/workflows/apply-radial-timeline-once.yml
          git config user.name "NOSMO Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add artifacts/nosmo-nexus/src/components/workspace-data.ts artifacts/nosmo-nexus/src/components/persistent-workspace.tsx .github/workflows/apply-radial-timeline-once.yml
          git commit -m "Add radial received-document timeline"
          git push origin HEAD:agent/persistent-project-graph

      - name: Checkout main for cleanup
        uses: actions/checkout@v4
        with:
          ref: main
          path: control

      - name: Remove one-time main trigger
        working-directory: control
        shell: bash
        run: |
          rm .github/workflows/trigger-radial-timeline.yml
          git config user.name "NOSMO Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/trigger-radial-timeline.yml
          git commit -m "Remove radial timeline trigger"
          git push origin HEAD:main
