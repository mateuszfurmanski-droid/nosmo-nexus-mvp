name: Export secure backup

on:
  push:
    paths:
      - .github/workflows/export-secure-backup.yml
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch all branches and tags
        shell: bash
        run: |
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*' --prune

      - name: Create complete Git bundle and working-tree snapshot
        shell: bash
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          out="${RUNNER_TEMP}/secure-backup"
          mkdir -p "${out}"
          git bundle create "${out}/${repo}.bundle" --all
          tar --exclude=.git -czf "${out}/${repo}-main-snapshot.tar.gz" .
          sha256sum "${out}/${repo}.bundle" "${out}/${repo}-main-snapshot.tar.gz" > "${out}/SHA256SUMS.txt"

      # PRs still verify that bundle/snapshot creation works, but skip artifact
      # upload so repository storage quota does not block development PRs.
      # Main/manual runs keep the actual backup artifact upload behaviour.
      - name: Upload secure backup artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: secure-backup-${{ github.event.repository.name }}
          path: ${{ runner.temp }}/secure-backup/
          if-no-files-found: error
          retention-days: 7
