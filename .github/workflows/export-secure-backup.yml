name: Export secure backup

on:
  push:
    paths:
      - .github/workflows/export-secure-backup.yml
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch all branches and tags
        shell: bash
        run: |
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*' --prune

      - name: Create complete Git bundle and working-tree snapshot
        shell: bash
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          out="${RUNNER_TEMP}/secure-backup"
          mkdir -p "${out}"
          git bundle create "${out}/${repo}.bundle" --all
          tar --exclude=.git -czf "${out}/${repo}-main-snapshot.tar.gz" .
          sha256sum "${out}/${repo}.bundle" "${out}/${repo}-main-snapshot.tar.gz" > "${out}/SHA256SUMS.txt"

      - name: Upload secure backup artifact
        id: upload-secure-backup
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: secure-backup-${{ github.event.repository.name }}
          path: ${{ runner.temp }}/secure-backup/
          if-no-files-found: error
          retention-days: 1

      - name: Warn when GitHub artifact quota blocks backup upload
        if: steps.upload-secure-backup.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning title=Secure backup artifact not uploaded::The Git bundle and snapshot were created, but GitHub artifact storage quota blocked upload. This is a GitHub Actions storage/quota gate, not an Android build failure. Free artifact storage or rerun this workflow later if a downloadable backup artifact is required."
