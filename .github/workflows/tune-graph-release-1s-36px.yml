name: Tune graph release 1s 36px

on:
  pull_request:
    branches:
      - agent/nexus-v1-project-shell

permissions:
  contents: write

jobs:
  tune-motion:
    if: github.head_ref == 'agent/persistent-project-graph'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout graph branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Apply one-second 36px release glide
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('artifacts/nosmo-nexus/src/components/persistent-workspace.tsx')
          text = path.read_text(encoding='utf-8')

          old_flow = 'const FLOW = { type: "spring" as const, stiffness: 82, damping: 24, mass: 0.85, restDelta: 0.45, restSpeed: 8 };'
          new_flow = 'const FLOW = { type: "tween" as const, duration: 0.85, ease: [0.22, 1, 0.36, 1] as const };'
          if old_flow not in text and new_flow not in text:
              raise SystemExit('FLOW definition did not match expected source')
          text = text.replace(old_flow, new_flow, 1)

          replacements = {
              'Math.max(-72, Math.min(72, info.velocity.x * 0.06))': 'Math.max(-36, Math.min(36, info.velocity.x * 0.035))',
              'Math.max(-72, Math.min(72, info.velocity.y * 0.06))': 'Math.max(-36, Math.min(36, info.velocity.y * 0.035))',
          }
          for old, new in replacements.items():
              if old not in text and new not in text:
                  raise SystemExit(f'Release glide marker did not match: {old}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit tuned motion
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Motion already tuned."
            exit 0
          fi
          git config user.name "NOSMO Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add artifacts/nosmo-nexus/src/components/persistent-workspace.tsx
          git commit -m "Limit graph release glide to 1s and 36px"
          git push origin HEAD:${{ github.head_ref }}
