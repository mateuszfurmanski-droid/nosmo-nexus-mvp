name: Apply Direct Touch Drag Fix

on:
  push:
    branches:
      - agent/direct-touch-drag-fix

permissions:
  contents: write

jobs:
  patch-validate-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/direct-touch-drag-fix

      - name: Patch direct drag behaviour
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('artifacts/nosmo-nexus/src/components/persistent-workspace.tsx')
          text = path.read_text(encoding='utf-8')

          old_const = 'const clampGlide = (value: number) => Math.max(-36, Math.min(36, value));\n'
          text = text.replace(old_const, '')

          old = '''      const slipX = gesture.moved ? clampGlide(gesture.velocityX * 0.035) : 0;
      const slipY = gesture.moved ? clampGlide(gesture.velocityY * 0.035) : 0;
      const finalPoint = {
        x: gesture.point.x + (deltaX + slipX) / gesture.zoom,
        y: gesture.point.y + (deltaY + slipY) / gesture.zoom,
      };'''
          new = '''      const finalPoint = {
        x: gesture.point.x + deltaX / gesture.zoom,
        y: gesture.point.y + deltaY / gesture.zoom,
      };'''

          if old not in text:
              raise SystemExit('Expected glide block not found; refusing unsafe patch.')
          text = text.replace(old, new, 1)

          direct_drag = 'x: gesture.point.x + deltaX / gesture.zoom'
          zero_lag = 'transition={dragging ? { duration: 0 } : FLOW}'
          if direct_drag not in text or zero_lag not in text:
              raise SystemExit('Direct-drag invariants missing after patch.')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck workspace
        run: pnpm run typecheck

      - name: Build graph preview
        env:
          PORT: 4173
          BASE_PATH: /apps/nexus-graph-preview/
        run: pnpm --filter @workspace/nosmo-nexus build

      - name: Add stable relationship-tree entry
        shell: bash
        run: |
          mkdir -p artifacts/nosmo-nexus/dist/public/relationship-tree
          cp artifacts/nosmo-nexus/dist/public/index.html artifacts/nosmo-nexus/dist/public/relationship-tree/index.html
          python - <<'PY'
          from pathlib import Path
          target = Path('artifacts/nosmo-nexus/dist/public/relationship-tree/index.html')
          html = target.read_text(encoding='utf-8')
          route = '<script>history.replaceState(null,"","/apps/nexus-graph-preview/relationship-tree");</script>'
          target.write_text(html.replace('</head>', route + '\n</head>'), encoding='utf-8')
          PY

      - name: Upload fixed preview
        uses: actions/upload-artifact@v4
        with:
          name: nexus-graph-preview-direct-drag
          path: artifacts/nosmo-nexus/dist/public
          if-no-files-found: error
          retention-days: 14

      - name: Commit source fix
        shell: bash
        run: |
          git config user.name "NOSMO Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add artifacts/nosmo-nexus/src/components/persistent-workspace.tsx
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Fix graph tiles to follow pointer exactly"
          git push origin HEAD:agent/direct-touch-drag-fix
