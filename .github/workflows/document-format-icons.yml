name: Document format icons

on:
  push:
    branches:
      - agent/persistent-project-graph
    paths:
      - .github/workflows/document-format-icons.yml

permissions:
  contents: write

jobs:
  update-document-icons:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout graph branch
        uses: actions/checkout@v4
        with:
          ref: agent/persistent-project-graph

      - name: Add file-format document icons
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('artifacts/nosmo-nexus/src/components/persistent-workspace.tsx')
          text = path.read_text(encoding='utf-8')

          marker = 'const edgeId = (a: string, b: string) => [a, b].sort().join("|");\n'
          helper = '''const edgeId = (a: string, b: string) => [a, b].sort().join("|");

function DocumentFormatIcon({
  node,
  large = false,
  compact = false,
}: {
  node: WorkspaceNode;
  large?: boolean;
  compact?: boolean;
}) {
  const format = node.sublabel.trim().toLowerCase();
  const excel = ["excel", "xlsx", "xls", "csv"].some((value) => format.includes(value));
  const pdf = format.includes("pdf");
  const word = ["word", "docx", "doc"].some((value) => format.includes(value));
  const image = ["image", "jpg", "jpeg", "png", "webp"].some((value) => format.includes(value));
  const Icon = node.Icon;
  const colour = excel
    ? "bg-[#217346]"
    : pdf
      ? "bg-[#d93636]"
      : word
        ? "bg-[#2b579a]"
        : image
          ? "bg-violet-600"
          : "bg-slate-600";
  const badge = excel ? "X" : pdf ? "PDF" : word ? "W" : image ? "IMG" : format.slice(0, 4).toUpperCase();
  const size = compact ? "h-9 w-9" : large ? "h-14 w-14" : "h-10 w-10";
  const iconSize = compact ? "h-4 w-4" : large ? "h-7 w-7" : "h-5 w-5";

  return (
    <span className={`relative flex ${size} items-center justify-center rounded-xl ${colour} text-white shadow-inner`}>
      <Icon className={iconSize} strokeWidth={2.2} />
      <span className={`absolute -bottom-1 -right-1 flex items-center justify-center rounded-md border border-white/35 bg-white px-1 font-black leading-none text-slate-900 shadow ${large ? "h-5 min-w-5 text-[8px]" : "h-4 min-w-4 text-[6px]"}`}>
        {badge}
      </span>
    </span>
  );
}
'''
          if 'function DocumentFormatIcon' not in text:
              if marker not in text:
                  raise SystemExit('edgeId marker not found')
              text = text.replace(marker, helper, 1)

          old_node_icon = '''                  <span className={`flex items-center justify-center rounded-xl ${style.chip} ${selectedNode ? "h-14 w-14" : "h-10 w-10"}`}>
                    <Icon className={selectedNode ? "h-7 w-7" : "h-5 w-5"} />
                  </span>'''
          new_node_icon = '''                  {node.type === "document" ? (
                    <DocumentFormatIcon node={node} large={selectedNode} />
                  ) : (
                    <span className={`flex items-center justify-center rounded-xl ${style.chip} ${selectedNode ? "h-14 w-14" : "h-10 w-10"}`}>
                      <Icon className={selectedNode ? "h-7 w-7" : "h-5 w-5"} />
                    </span>
                  )}'''
          if old_node_icon in text:
              text = text.replace(old_node_icon, new_node_icon, 1)
          elif '<DocumentFormatIcon node={node}' not in text:
              raise SystemExit('node icon marker not found')

          old_selected_icon = '''            <div className={`flex h-11 w-11 shrink-0 items-center justify-center rounded-xl ${TYPE_STYLE[selected.type].chip}`}><selected.Icon className="h-5 w-5" /></div>'''
          new_selected_icon = '''            <div className={`flex h-11 w-11 shrink-0 items-center justify-center rounded-xl ${selected.type === "document" ? "" : TYPE_STYLE[selected.type].chip}`}>
              {selected.type === "document" ? <DocumentFormatIcon node={selected} compact /> : <selected.Icon className="h-5 w-5" />}
            </div>'''
          if old_selected_icon in text:
              text = text.replace(old_selected_icon, new_selected_icon, 1)
          elif '<DocumentFormatIcon node={selected}' not in text:
              raise SystemExit('selected icon marker not found')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit document format icons
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Document format icons already installed."
            exit 0
          fi
          git config user.name "NOSMO Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add artifacts/nosmo-nexus/src/components/persistent-workspace.tsx
          git commit -m "Use file-format icons for document nodes"
          git push origin HEAD:agent/persistent-project-graph
