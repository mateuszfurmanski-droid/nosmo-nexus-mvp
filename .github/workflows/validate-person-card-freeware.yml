name: Validate Person Card Freeware

on:
  push:
    branches:
      - codex/person-card-freeware
    paths:
      - modules/person-card-freeware/**
      - artifacts/api-server/src/person-card-freeware/**
      - artifacts/api-server/src/person-card-freeware.ts
      - artifacts/api-server/build.mjs
      - artifacts/api-server/package.json
      - lib/db/src/schema/nexusPerson.ts
      - lib/db/src/schema/nexusPersonWorkProfile.ts
      - lib/db/src/schema/index.ts
      - .github/workflows/validate-person-card-freeware.yml
  pull_request:
    paths:
      - modules/person-card-freeware/**
      - artifacts/api-server/src/person-card-freeware/**
      - artifacts/api-server/src/person-card-freeware.ts
      - artifacts/api-server/build.mjs
      - artifacts/api-server/package.json
      - lib/db/src/schema/nexusPerson.ts
      - lib/db/src/schema/nexusPersonWorkProfile.ts
      - lib/db/src/schema/index.ts

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Frozen donor and source manifest
        shell: bash
        run: |
          grep -F '"version": "v47top1"' modules/person-card-freeware/source-manifest.json
          grep -F '"blobSha": "6b33057751dacb58555fc3462f2b6b811f53d48d"' modules/person-card-freeware/source-manifest.json
          grep -F '"head": "fde179a4ad0e08ce418821b7b1017099ec9d3f14"' modules/person-card-freeware/source-manifest.json
          grep -F '"head": "d1de9c4aa5d7f9ed44284bea5ceed752f493456c"' modules/person-card-freeware/source-manifest.json

      - name: Standalone product boundary
        shell: bash
        run: |
          test -f modules/person-card-freeware/index.html
          test -f modules/person-card-freeware/onboarding.html
          test -f modules/person-card-freeware/agency-invite.html
          test -f modules/person-card-freeware/data-fetcher/index.html
          grep -Fi 'Work Hub' modules/person-card-freeware/index.html
          grep -F '>Inbox</span>' modules/person-card-freeware/index.html
          grep -Fi 'Data Fetcher' modules/person-card-freeware/index.html
          grep -F 'Find Work' modules/person-card-freeware/index.html
          grep -F 'Matches' modules/person-card-freeware/index.html
          grep -F 'Agencies' modules/person-card-freeware/index.html
          grep -F 'AI Check' modules/person-card-freeware/index.html
          grep -F 'Request Pack' modules/person-card-freeware/index.html
          grep -F 'Offer Work' modules/person-card-freeware/index.html
          runtime_args=(--include='*.html' --include='*.js' --include='*.json')
          ! grep -RFi "${runtime_args[@]}" 'Open in Tree' modules/person-card-freeware
          ! grep -RFi "${runtime_args[@]}" 'relationship-tree' modules/person-card-freeware
          ! grep -RFi "${runtime_args[@]}" '/apps/nexus/' modules/person-card-freeware
          ! grep -RFi "${runtime_args[@]}" 'NEXUS_DEMO_PROJECT_001_eSAFE_CATANIA' modules/person-card-freeware
          ! grep -RFi "${runtime_args[@]}" 'SKANSKA' modules/person-card-freeware
          ! grep -RFi "${runtime_args[@]}" 'DoorFlow' modules/person-card-freeware
          ! grep -RFi "${runtime_args[@]}" 'Work Wallet' modules/person-card-freeware
          ! grep -RFi "${runtime_args[@]}" 'FabStation' modules/person-card-freeware

      - name: Static JavaScript and JSON validation
        shell: bash
        run: |
          node --check modules/person-card-freeware/js/person-work-profile.js
          node --check modules/person-card-freeware/js/person-onboarding-v47.js
          node --check modules/person-card-freeware/js/person-agency-invite.js
          node --check modules/person-card-freeware/js/person-work-overlay-controller.js
          node --check modules/person-card-freeware/data-fetcher/app.js
          node -e "JSON.parse(require('fs').readFileSync('modules/person-card-freeware/data/person-work-profile-kamil.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('modules/person-card-freeware/source-manifest.json','utf8'))"

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck canonical Person and Freeware API
        run: |
          pnpm run typecheck:libs
          pnpm --filter @workspace/api-server run typecheck

      - name: Build standalone server entry
        run: |
          pnpm --filter @workspace/api-server run build
          test -f artifacts/api-server/dist/person-card-freeware.mjs

      - name: Static route smoke
        shell: bash
        run: |
          cd modules/person-card-freeware
          python3 -m http.server 8128 >/tmp/person-card-freeware-static.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 2
          curl --fail http://127.0.0.1:8128/index.html >/dev/null
          curl --fail http://127.0.0.1:8128/onboarding.html >/dev/null
          curl --fail http://127.0.0.1:8128/agency-invite.html >/dev/null
          curl --fail http://127.0.0.1:8128/section.html?section=cv >/dev/null
          curl --fail http://127.0.0.1:8128/data-fetcher/ >/dev/null
          curl --fail http://127.0.0.1:8128/directory.html >/dev/null

      - name: Backend contract boundary
        shell: bash
        run: |
          grep -F '/person-card/jobs/search' artifacts/api-server/src/person-card-freeware/job-search.ts
          grep -F '/person-card/jobs/ai/match' artifacts/api-server/src/person-card-freeware/job-ai-match.ts
          grep -F '/person-card/onboarding/claim' artifacts/api-server/src/person-card-freeware/onboarding.ts
          grep -F '/person-card/onboarding/drafts/load' artifacts/api-server/src/person-card-freeware/onboarding.ts
          grep -F '/person-card/onboarding/drafts/save' artifacts/api-server/src/person-card-freeware/onboarding.ts
          grep -F 'nexus-person-work-profile/v1' lib/db/src/schema/nexusPersonWorkProfile.ts
          grep -F 'nexus_pm_people' lib/db/src/schema/nexusPerson.ts
          ! grep -RFi 'relationship-tree' artifacts/api-server/src/person-card-freeware
