name: Patch glossy document nodes

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-glossy-document-nodes.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/persistent-project-graph
          fetch-depth: 0

      - name: Use full glossy icons in document nodes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('artifacts/nosmo-nexus/src/components/persistent-workspace.tsx')
          text = path.read_text(encoding='utf-8')

          old = '''                  <span className={`flex items-center justify-center rounded-xl ${style.chip} ${selectedNode ? "h-14 w-14" : "h-10 w-10"}`}>
                    <Icon className={selectedNode ? "h-7 w-7" : "h-5 w-5"} />
                  </span>'''
          new = '''                  {node.type === "document" ? (
                    <Icon
                      className={selectedNode
                        ? "h-20 w-20 drop-shadow-[0_10px_16px_rgba(0,0,0,.48)]"
                        : "h-14 w-14 drop-shadow-[0_8px_13px_rgba(0,0,0,.42)]"}
                    />
                  ) : (
                    <span className={`flex items-center justify-center rounded-xl ${style.chip} ${selectedNode ? "h-14 w-14" : "h-10 w-10"}`}>
                      <Icon className={selectedNode ? "h-7 w-7" : "h-5 w-5"} />
                    </span>
                  )}'''
          if old not in text:
              raise SystemExit('document node icon block not found')
          text = text.replace(old, new, 1)

          old_detail = '''            <div className={`flex h-11 w-11 shrink-0 items-center justify-center rounded-xl ${TYPE_STYLE[selected.type].chip}`}><selected.Icon className="h-5 w-5" /></div>'''
          new_detail = '''            <div className={`flex h-11 w-11 shrink-0 items-center justify-center rounded-xl ${selected.type === "document" ? "" : TYPE_STYLE[selected.type].chip}`}>
              {selected.type === "document" ? (
                <selected.Icon className="h-10 w-10 drop-shadow-[0_6px_10px_rgba(0,0,0,.42)]" />
              ) : (
                <selected.Icon className="h-5 w-5" />
              )}
            </div>'''
          if old_detail not in text:
              raise SystemExit('selected document icon block not found')
          text = text.replace(old_detail, new_detail, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit branch patch
        shell: bash
        run: |
          git config user.name "NOSMO Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add artifacts/nosmo-nexus/src/components/persistent-workspace.tsx
          if ! git diff --cached --quiet; then
            git commit -m "Show full glossy icons in document nodes"
            git push origin HEAD:agent/persistent-project-graph
          fi
