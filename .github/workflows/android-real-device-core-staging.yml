name: NEXUS Android Real Device Core Staging

on:
  workflow_dispatch:
  push:
    branches:
      - codex/android-real-device-core-staging
    paths:
      - native/nexus-work-mode-native/**
      - .github/workflows/android-real-device-core-staging.yml

permissions:
  contents: read

env:
  NEXUS_ANDROID_WEB_ORIGIN: https://nosmo-nexus-cloud-staging.vercel.app

jobs:
  build-real-device-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify real-device identity boundary
        shell: bash
        run: |
          set -euo pipefail
          BASE="native/nexus-work-mode-native/app/src/main/java/tech/nosmo/nexus/workmode"
          CLAIM="$BASE/NexusIdentityClaimClient.java"
          SCREEN="$BASE/IdentityClaimActivity.java"
          HOME="$BASE/WorkModeHomeActivity.java"
          MANIFEST="native/nexus-work-mode-native/app/src/main/AndroidManifest.xml"
          echo "claim client: $CLAIM"
          test -r "$CLAIM"
          test -r "$SCREEN"
          grep -Fq '/api/nexus/core/identity/claim' "$CLAIM"
          grep -Eq 'Authorization.*Bearer' "$CLAIM"
          grep -Fq 'NexusMobileSession.getSessionToken' "$SCREEN"
          grep -Fq 'IdentityClaimActivity.class' "$HOME"
          grep -Fq '.IdentityClaimActivity' "$MANIFEST"
          ! grep -Fq 'SharedPreferences' "$CLAIM"
          ! grep -Fq 'SharedPreferences' "$SCREEN"
          ! grep -Eqi 'provider.?subject|person-esafe-mateusz|person-esafe-joanna' "$CLAIM" "$SCREEN"
          ! grep -Eqi 'claim(code)?[[:space:]]*=' native/nexus-work-mode-native/app/build.gradle
          echo ANDROID_REAL_DEVICE_IDENTITY_BOUNDARY_PASS

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build exact-head debug APK and release AAB
        working-directory: native/nexus-work-mode-native
        run: gradle :app:assembleDebug :app:bundleRelease --no-daemon --stacktrace

      - name: Verify APK staging origin and security surface
        shell: bash
        run: |
          set -euo pipefail
          APK="native/nexus-work-mode-native/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          unzip -l "$APK" | grep -q classes.dex
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          "$AAPT" dump badging "$APK" | tee /tmp/badging.txt
          "$AAPT" dump permissions "$APK" | tee /tmp/permissions.txt
          grep -q "package: name='tech.nosmo.nexus.workmode.foldtest'" /tmp/badging.txt
          grep -q android.permission.INTERNET /tmp/permissions.txt
          ! grep -q android.permission.MANAGE_EXTERNAL_STORAGE /tmp/permissions.txt
          ! grep -q android.permission.SYSTEM_ALERT_WINDOW /tmp/permissions.txt
          ! grep -q android.permission.BIND_ACCESSIBILITY_SERVICE /tmp/permissions.txt

      - name: Prepare installable device artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android-real-device
          cp native/nexus-work-mode-native/app/build/outputs/apk/debug/app-debug.apk android-real-device/NEXUS-Work-Mode-Core-Staging.apk
          cp native/nexus-work-mode-native/app/build/outputs/bundle/release/app-release.aab android-real-device/NEXUS-Work-Mode-Core-Staging.aab
          sha256sum android-real-device/* > android-real-device/SHA256SUMS.txt
          cp /tmp/badging.txt android-real-device/APK_BADGING.txt
          cp /tmp/permissions.txt android-real-device/APK_PERMISSIONS.txt

      - name: Upload exact-head Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Android-Real-Device-Core-Staging
          path: android-real-device/*
          if-no-files-found: error
          retention-days: 2
