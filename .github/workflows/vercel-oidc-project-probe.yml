name: Vercel OIDC Project Probe

on:
  push:
    branches:
      - codex/android-worker-home-automation-bypass
    paths:
      - .github/workflows/vercel-oidc-project-probe.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Mint GitHub OIDC token
        uses: actions/github-script@v7
        id: github_oidc
        with:
          script: |
            const token = await core.getIDToken();
            core.setSecret(token);
            core.setOutput('token', token);

      - name: Exchange OIDC without exposing credentials
        shell: bash
        env:
          GH_OIDC_TOKEN: ${{ steps.github_oidc.outputs.token }}
          VERCEL_TEAM: mateuszfurmanski-3044s-projects
          VERCEL_PROJECT: prj_SlNzV4zgxagf5clGrH8UbFZyJwCK
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/vercel-exchange.json -w '%{http_code}' -X POST https://api.vercel.com/login/oauth/token             --data 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange'             --data 'client_id=cl_kyUx2zVvA4MGptBohkmtYHJly2XltXzD'             --data 'subject_token_type=urn:ietf:params:oauth:token-type:id_token'             --data 'requested_token_type=urn:ietf:params:oauth:token-type:access_token'             --data-urlencode "team_id_or_slug=$VERCEL_TEAM"             --data-urlencode "subject_token=$GH_OIDC_TOKEN")
          echo "OIDC_EXCHANGE_HTTP=$code"
          if [ "$code" != "200" ]; then
            jq '{error,error_description,message}' /tmp/vercel-exchange.json || true
            exit 1
          fi
          token=$(jq -r '.access_token // empty' /tmp/vercel-exchange.json)
          test -n "$token"
          echo "::add-mask::$token"
          rm -f /tmp/vercel-exchange.json

          project_code=$(curl -sS -o /tmp/vercel-project.json -w '%{http_code}'             -H "Authorization: Bearer $token"             "https://api.vercel.com/v9/projects/$VERCEL_PROJECT?teamId=$VERCEL_TEAM")
          echo "VERCEL_PROJECT_READ_HTTP=$project_code"
          if [ "$project_code" = "200" ]; then
            jq '{id,name,accountId,framework}' /tmp/vercel-project.json
            echo VERCEL_OIDC_PROJECT_READ_PASS
          else
            jq '{error}' /tmp/vercel-project.json || true
            exit 1
          fi
          rm -f /tmp/vercel-project.json
