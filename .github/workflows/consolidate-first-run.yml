name: Consolidate First Run into Demo Hub

on:
  push:
    branches:
      - agent/connected-demo-hub
    paths:
      - .github/workflows/consolidate-first-run.yml

permissions:
  contents: write

jobs:
  consolidate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out connected demo hub
        uses: actions/checkout@v4
        with:
          ref: agent/connected-demo-hub
          fetch-depth: 0

      - name: Copy First Run implementation
        run: |
          git fetch origin agent/android-first-run-prototype:refs/remotes/origin/agent/android-first-run-prototype
          git checkout origin/agent/android-first-run-prototype -- \
            artifacts/nosmo-nexus/src/pages/first-run.tsx \
            artifacts/nosmo-nexus/src/pages/first-run.README.md

      - name: Connect route and Nexus menu entry
        run: |
          python - <<'PY'
          from pathlib import Path

          app_path = Path('artifacts/nosmo-nexus/src/App.tsx')
          app = app_path.read_text()
          if 'import FirstRun from "@/pages/first-run";' not in app:
              marker = 'import PlanReview from "@/pages/plan-review";\n'
              if marker not in app:
                  raise SystemExit('App import marker not found')
              app = app.replace(marker, marker + 'import FirstRun from "@/pages/first-run";\n', 1)
          if '<Route path="/first-run" component={FirstRun} />' not in app:
              marker = '      {/* Specialist full-screen workflows intentionally run without the app shell. */}\n'
              if marker not in app:
                  raise SystemExit('Router marker not found')
              app = app.replace(marker, marker + '      <Route path="/first-run" component={FirstRun} />\n', 1)
          app_path.write_text(app)

          menu_path = Path('artifacts/nosmo-nexus/src/pages/nexus-launchpad.tsx')
          menu = menu_path.read_text()
          if 'name: "Nexus First Run & Discovery Cloud"' not in menu:
              marker = 'const connectedDemos: ConnectedDemo[] = [\n'
              card = '''  {\n    name: "Nexus First Run & Discovery Cloud",\n    description: "Android-first Nexus Awakening, private source discovery, Work Mode and a reviewable Discovery Cloud in one guided entry flow.",\n    status: "ACTIVE",\n    href: "/first-run",\n    linkType: "internal",\n    icon: AppWindow,\n    context: "Android-first onboarding · synthetic discovery",\n    capabilities: ["Nexus Awakening", "Discovery Cloud", "Work Mode", "Private review"],\n  },\n'''
              if marker not in menu:
                  raise SystemExit('Connected demos marker not found')
              menu = menu.replace(marker, marker + card, 1)
          menu = menu.replace(
              'One entry point for the working DoorFlow and Electrical demonstrations, the Replit relationship tree, Person Cards and the wider Nexus operating layers.',
              'One entry point for First Run and Discovery Cloud, DoorFlow, Electrical, the Relationship Tree, Person Cards and the wider Nexus operating layers.'
          )
          menu_path.write_text(menu)

          docs_path = Path('artifacts/nosmo-nexus/public/CONNECTED_DEMOS.md')
          docs = docs_path.read_text()
          first_run_line = '- `/first-run` — Android-first Nexus Awakening, Work Mode and Discovery Cloud prototype;\n'
          if first_run_line not in docs:
              marker = '## Working entries\n\n'
              if marker not in docs:
                  raise SystemExit('Connected demos documentation marker not found')
              docs = docs.replace(marker, marker + first_run_line, 1)
          docs_path.write_text(docs)
          PY

      - name: Commit consolidated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/nosmo-nexus/src/App.tsx \
                  artifacts/nosmo-nexus/src/pages/first-run.tsx \
                  artifacts/nosmo-nexus/src/pages/first-run.README.md \
                  artifacts/nosmo-nexus/src/pages/nexus-launchpad.tsx \
                  artifacts/nosmo-nexus/public/CONNECTED_DEMOS.md
          git commit -m "feat: consolidate First Run and Discovery Cloud into Nexus hub"
          git push origin HEAD:agent/connected-demo-hub
