name: Build PR45 Preview

on:
  push:
    branches:
      - codex/esafe-project-graph-hydration
  workflow_dispatch:

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build isolated preview
        env:
          BASE_PATH: /apps/nexus-pr45-preview/
        run: pnpm --filter @workspace/nosmo-nexus run build

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-pr45-preview
          path: artifacts/nosmo-nexus/dist/public
          if-no-files-found: error
          retention-days: 14
