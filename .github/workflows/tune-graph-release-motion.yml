name: Tune graph release motion

on:
  pull_request:
    branches:
      - agent/nexus-v1-project-shell

permissions:
  contents: write

jobs:
  tune-motion:
    if: github.head_ref == 'agent/persistent-project-graph'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout graph branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Apply short controlled release glide
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('artifacts/nosmo-nexus/src/components/persistent-workspace.tsx')
          text = path.read_text(encoding='utf-8')

          old_flow = 'const FLOW = { type: "spring" as const, stiffness: 24, damping: 18, mass: 1.55 };'
          new_flow = 'const FLOW = { type: "spring" as const, stiffness: 82, damping: 24, mass: 0.85, restDelta: 0.45, restSpeed: 8 };'
          if old_flow in text:
              text = text.replace(old_flow, new_flow, 1)
          elif new_flow not in text:
              raise SystemExit('FLOW definition did not match expected source')

          old_drag = '''              onDragEnd={(_, info) => {
                const next = {
                  ...pinned,
                  [node.id]: { x: point.x + info.offset.x / zoom, y: point.y + info.offset.y / zoom },
                };
                setPinned(next);
                persist(next, manualEdges);
              }}'''
          new_drag = '''              onDragEnd={(_, info) => {
                // Keep a small physical release glide, but cap it so a tile
                // settles quickly instead of floating across the workspace.
                const slipX = Math.max(-72, Math.min(72, info.velocity.x * 0.06));
                const slipY = Math.max(-72, Math.min(72, info.velocity.y * 0.06));
                const next = {
                  ...pinned,
                  [node.id]: {
                    x: point.x + (info.offset.x + slipX) / zoom,
                    y: point.y + (info.offset.y + slipY) / zoom,
                  },
                };
                setPinned(next);
                persist(next, manualEdges);
              }}'''
          if old_drag in text:
              text = text.replace(old_drag, new_drag, 1)
          elif new_drag not in text:
              raise SystemExit('onDragEnd block did not match expected source')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit tuned motion
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Motion already tuned."
            exit 0
          fi
          git config user.name "NOSMO Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add artifacts/nosmo-nexus/src/components/persistent-workspace.tsx
          git commit -m "Tune graph release glide"
          git push origin HEAD:${{ github.head_ref }}
