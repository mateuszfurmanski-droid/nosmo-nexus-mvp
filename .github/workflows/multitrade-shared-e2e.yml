name: Multitrade Shared Connector E2E

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/multitrade-shared-e2e.yml'
      - 'scripts/multitrade-shared-e2e.mts'
      - 'src/connectors/multitradeContextProjection.ts'
      - 'src/connectors/erpnext/**'
      - 'src/connectors/qfield/**'
      - 'src/connectors/openmaint/**'
      - 'src/connectors/bcf/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shared-read-contract:
    if: github.event_name != 'pull_request' || github.head_ref == 'codex/multitrade-shared-e2e-harness'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck workspace
        run: pnpm run typecheck

      - name: Execute shared multitrade read-only E2E harness
        run: pnpm --dir scripts exec tsx ./multitrade-shared-e2e.mts
