name: Deploy Nexus Menu

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck Nexus
        run: pnpm --filter @workspace/nosmo-nexus typecheck

      - name: Build Nexus for GitHub Pages
        env:
          BASE_PATH: /nosmo-nexus-mvp/
        run: pnpm --filter @workspace/nosmo-nexus build

      - name: Add SPA fallback
        run: |
          cp artifacts/nosmo-nexus/dist/public/index.html artifacts/nosmo-nexus/dist/public/404.html
          touch artifacts/nosmo-nexus/dist/public/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: artifacts/nosmo-nexus/dist/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
