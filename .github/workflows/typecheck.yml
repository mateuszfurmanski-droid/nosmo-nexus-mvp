name: Validate and Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    # Draft PRs are used for architecture scaffolding and migration planning.
    # Run the full validation suite on main, manual dispatch, and non-draft PRs.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Disposable job-local PostgreSQL only. This is never a deployment DB.
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/nexus_cloud_ci
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nexus_cloud_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nexus_cloud_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate unified authenticated runtime topology
        run: node scripts/src/validate-unified-nexus-runtime.mjs

      - name: Typecheck workspace
        run: pnpm run typecheck

      - name: Smoke test Nexus Cloud Google Drive adapter
        run: pnpm --filter @workspace/scripts smoke:nexus-cloud-google-drive-adapter

      - name: Smoke test Nexus Cloud persistence input bridge
        run: pnpm --filter @workspace/scripts exec tsx ../lib/db/src/nexusCloudPersistenceInputSmoke.ts

      - name: Smoke test canonical Nexus Cloud write access
        run: pnpm --filter @workspace/scripts smoke:nexus-cloud-access-resolver

      - name: Build Nexus web application
        env:
          PORT: 4173
          BASE_PATH: /
        run: pnpm --filter @workspace/nosmo-nexus build

      - name: Build authenticated Nexus API server
        run: pnpm --filter @workspace/api-server build

      - name: Apply schema to disposable CI PostgreSQL only
        run: pnpm --filter @workspace/db push

      - name: Smoke test unified authenticated runtime
        env:
          PORT: 3000
          NODE_ENV: test
          WORK_WALLET_DEMO_MODE: "true"
          NEXUS_IDENTITY_BINDING_MODE: "disabled"
        run: |
          pnpm --filter @workspace/api-server start > /tmp/nexus-unified-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; cat /tmp/nexus-unified-server.log' EXIT

          ready=0
          for attempt in $(seq 1 40); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/health > /dev/null; then
              ready=1
              break
            fi
            sleep 0.5
          done

          test "$ready" = "1"
          curl --fail --silent --show-error http://127.0.0.1:3000/health \
            | grep '"authRuntime":"api-server"' > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:3000/api/healthz \
            | grep '"status":"ok"' > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:3000/ \
            | grep '<div id="root"' > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:3000/relationship-tree \
            | grep '<div id="root"' > /dev/null

          curl --fail --silent --show-error \
            http://127.0.0.1:3000/api/integrations/work-wallet/status \
            | grep '"demoMode":true' > /dev/null

          cat > /tmp/work-wallet-event.json <<'JSON'
          {
            "id": "ci-work-wallet-event-001",
            "eventType": "INDUCTION_COMPLETED",
            "projectId": "HALIFAX-DEMO",
            "personId": "p2",
            "sourceRecord": "WW-IND-CI-001",
            "title": "Site induction completed",
            "detail": "Synthetic CI event"
          }
          JSON

          first_status=$(curl --silent --show-error --output /tmp/first-event.json --write-out '%{http_code}' \
            --header 'Content-Type: application/json' \
            --data @/tmp/work-wallet-event.json \
            http://127.0.0.1:3000/api/integrations/work-wallet/demo-events)
          test "$first_status" = "202"
          grep '"status":"accepted"' /tmp/first-event.json > /dev/null

          duplicate_status=$(curl --silent --show-error --output /tmp/duplicate-event.json --write-out '%{http_code}' \
            --header 'Content-Type: application/json' \
            --data @/tmp/work-wallet-event.json \
            http://127.0.0.1:3000/api/integrations/work-wallet/demo-events)
          test "$duplicate_status" = "200"
          grep '"status":"duplicate"' /tmp/duplicate-event.json > /dev/null

      - name: Upload Nexus build
        uses: actions/upload-artifact@v4
        with:
          name: nosmo-nexus-web
          path: artifacts/nosmo-nexus/dist/public
          if-no-files-found: error
          retention-days: 2
