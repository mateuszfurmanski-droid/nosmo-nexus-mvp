name: Validate and Build

on:
  push:
    branches:
      - main
      - codex/work-wallet-reconcile-slice-k-extension
      - codex/work-wallet-reconcile-slice-l-ticket-core-test
      - codex/work-wallet-reconcile-slice-m-canonical-pipeline-test
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    # Draft PRs are used for architecture scaffolding and migration planning.
    # Run the full validation suite on main, manual dispatch, non-draft PRs, and
    # bounded Work Wallet integration branch pushes used for controlled validation.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Work Wallet extension ticket receiver
        run: node tools/nexus-overlay-extension/tests/validate-context-ticket-receiver.mjs

      - name: Validate Work Wallet Context Ticket core
        run: pnpm --filter @workspace/api-server validate:work-wallet-ticket-core

      - name: Validate canonical Work Wallet ticket pipeline
        run: pnpm --filter @workspace/api-server validate:work-wallet-canonical-pipeline

      - name: Typecheck workspace
        run: pnpm run typecheck

      - name: Build Nexus web application
        env:
          PORT: 4173
          BASE_PATH: /
        run: pnpm --filter @workspace/nosmo-nexus build

      - name: Build canonical Nexus API runtime
        run: pnpm --filter @workspace/api-server build

      - name: Smoke unified Nexus runtime and Work Wallet gateway
        env:
          PORT: 3000
          WORK_WALLET_DEMO_MODE: "true"
          NEXUS_CORS_ALLOWED_ORIGINS: "https://nexus-ci.example"
        run: |
          pnpm --filter @workspace/api-server start > /tmp/nexus-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; cat /tmp/nexus-server.log' EXIT

          ready=0
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/health > /dev/null; then
              ready=1
              break
            fi
            sleep 0.5
          done

          test "$ready" = "1"
          curl --fail --silent --show-error http://127.0.0.1:3000/ > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:3000/modules > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:3000/workspace > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:3000/safety-connector > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:3000/safety-connector-demo > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:3000/electrical-commissioning/ > /dev/null

          curl --fail --silent --show-error \
            http://127.0.0.1:3000/api/integrations/work-wallet/status \
            | grep '"demoMode":true' > /dev/null

          cat > /tmp/work-wallet-event.json <<'JSON'
          {
            "id": "ci-work-wallet-event-001",
            "eventType": "INDUCTION_COMPLETED",
            "projectId": "HALIFAX-DEMO",
            "personId": "p2",
            "sourceRecord": "WW-IND-CI-001",
            "title": "Site induction completed",
            "detail": "Synthetic CI event"
          }
          JSON

          first_status=$(curl --silent --show-error --output /tmp/first-event.json --write-out '%{http_code}' \
            --header 'Content-Type: application/json' \
            --data @/tmp/work-wallet-event.json \
            http://127.0.0.1:3000/api/integrations/work-wallet/demo-events)
          test "$first_status" = "202"
          grep '"status":"accepted"' /tmp/first-event.json > /dev/null

          duplicate_status=$(curl --silent --show-error --output /tmp/duplicate-event.json --write-out '%{http_code}' \
            --header 'Content-Type: application/json' \
            --data @/tmp/work-wallet-event.json \
            http://127.0.0.1:3000/api/integrations/work-wallet/demo-events)
          test "$duplicate_status" = "200"
          grep '"status":"duplicate"' /tmp/duplicate-event.json > /dev/null

          curl --fail --silent --show-error \
            http://127.0.0.1:3000/api/integrations/work-wallet/demo-events \
            | grep 'ci-work-wallet-event-001' > /dev/null

          allowed_origin=$(curl --silent --show-error --request OPTIONS \
            --header 'Origin: https://nexus-ci.example' \
            --header 'Access-Control-Request-Method: GET' \
            --dump-header - --output /dev/null \
            http://127.0.0.1:3000/api/healthz \
            | tr -d '\r' \
            | grep -i '^Access-Control-Allow-Origin:' || true)
          test "$allowed_origin" = "Access-Control-Allow-Origin: https://nexus-ci.example"

          blocked_origin=$(curl --silent --show-error --request OPTIONS \
            --header 'Origin: https://evil.example' \
            --header 'Access-Control-Request-Method: GET' \
            --dump-header - --output /dev/null \
            http://127.0.0.1:3000/api/healthz \
            | tr -d '\r' \
            | grep -i '^Access-Control-Allow-Origin:' || true)
          test -z "$blocked_origin"

      - name: Upload Nexus build
        uses: actions/upload-artifact@v4
        with:
          name: nosmo-nexus-web
          path: artifacts/nosmo-nexus/dist/public
          if-no-files-found: error
          retention-days: 2
