name: Validate and Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/nexus_ci
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nexus_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nexus_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate PKG-015/017 connector, identity, project and runtime boundaries
        run: |
          node scripts/src/validate-work-wallet-context.mjs
          node scripts/src/validate-nexus-browser-session.mjs
          node scripts/src/validate-nexus-person-binding.mjs
          pnpm --filter @workspace/scripts exec tsx ../artifacts/api-server/src/validate-nexus-project-authorization.ts
          node scripts/src/validate-unified-nexus-runtime.mjs

      - name: Typecheck workspace
        run: pnpm run typecheck

      - name: Build Nexus web application
        env:
          PORT: 4173
          BASE_PATH: /
        run: pnpm --filter @workspace/nosmo-nexus build

      - name: Build canonical API server
        run: pnpm --filter @workspace/api-server build

      - name: Apply disposable CI database schema
        run: pnpm --filter @workspace/db push

      - name: Smoke test unified production runtime with connector context
        env:
          PORT: 3000
          NODE_ENV: test
          WORK_WALLET_DEMO_MODE: "true"
          NEXUS_INTEGRATION_KEY: "ci-integration-key"
          WORK_WALLET_NEXUS_NODE_MAP_JSON: '{"halifax-demo|PER-201":"t-fire"}'
        run: |
          pnpm --filter @workspace/api-server start > /tmp/nexus-unified-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; cat /tmp/nexus-unified-server.log' EXIT

          ready=0
          for attempt in $(seq 1 40); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/health > /dev/null; then
              ready=1
              break
            fi
            sleep 0.5
          done

          test "$ready" = "1"
          curl --fail --silent --show-error http://127.0.0.1:3000/api/healthz | grep '"status":"ok"' > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:3000/ | grep '<div id="root"' > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:3000/relationship-tree | grep '<div id="root"' > /dev/null

          session_status=$(curl --silent --show-error --output /tmp/nexus-session.json --write-out '%{http_code}' \
            http://127.0.0.1:3000/api/nexus/session)
          test "$session_status" = "401"
          grep '"bindingStatus":"UNAUTHENTICATED"' /tmp/nexus-session.json > /dev/null
          grep '"canIssueContextTicket":false' /tmp/nexus-session.json > /dev/null

          curl --fail --silent --show-error \
            http://127.0.0.1:3000/api/integrations/work-wallet/status \
            | grep '"contextContract":"nexus-work-wallet-context/v1"' > /dev/null

          cat > /tmp/work-wallet-demo-event.json <<'JSON'
          {
            "id": "ci-work-wallet-demo-job-001",
            "eventType": "ASSET_INSPECTION_COMPLETED",
            "projectId": "halifax-demo",
            "sourceRecord": "JOB-01",
            "sourceObjectType": "job",
            "title": "Synthetic job event",
            "detail": "Must not enter browser context"
          }
          JSON

          first_status=$(curl --silent --show-error --output /tmp/first-event.json --write-out '%{http_code}' \
            --header 'Content-Type: application/json' \
            --data @/tmp/work-wallet-demo-event.json \
            http://127.0.0.1:3000/api/integrations/work-wallet/demo-events)
          test "$first_status" = "202"
          grep '"status":"accepted"' /tmp/first-event.json > /dev/null

          duplicate_status=$(curl --silent --show-error --output /tmp/duplicate-event.json --write-out '%{http_code}' \
            --header 'Content-Type: application/json' \
            --data @/tmp/work-wallet-demo-event.json \
            http://127.0.0.1:3000/api/integrations/work-wallet/demo-events)
          test "$duplicate_status" = "200"
          grep '"status":"duplicate"' /tmp/duplicate-event.json > /dev/null

          curl --fail --silent --show-error \
            'http://127.0.0.1:3000/api/integrations/work-wallet/demo-context?projectId=HALIFAX-DEMO&sourceRecord=JOB-01' \
            > /tmp/demo-context.json
          grep '"schema":"nexus-work-wallet-context/v1"' /tmp/demo-context.json > /dev/null
          grep '"contextSource":"CONNECTOR_VERIFIED_CONTEXT"' /tmp/demo-context.json > /dev/null
          grep '"nexusNodeId":"t-install"' /tmp/demo-context.json > /dev/null
          grep '"developmentContext":true' /tmp/demo-context.json > /dev/null
          ! grep '"title"' /tmp/demo-context.json > /dev/null
          ! grep '"detail"' /tmp/demo-context.json > /dev/null

          unknown_status=$(curl --silent --show-error --output /tmp/unknown-context.json --write-out '%{http_code}' \
            'http://127.0.0.1:3000/api/integrations/work-wallet/demo-context?projectId=halifax-demo&sourceRecord=JOB-010')
          test "$unknown_status" = "404"

          cat > /tmp/work-wallet-live-event.json <<'JSON'
          {
            "id": "ci-work-wallet-live-permit-001",
            "eventType": "PERMIT_RENEWED",
            "projectId": "halifax-demo",
            "sourceRecord": "PER-201",
            "sourceObjectType": "permit",
            "title": "Synthetic protected permit event",
            "detail": "Must not enter browser context"
          }
          JSON

          live_event_status=$(curl --silent --show-error --output /tmp/live-event.json --write-out '%{http_code}' \
            --header 'Content-Type: application/json' \
            --header 'X-Nexus-Integration-Key: ci-integration-key' \
            --data @/tmp/work-wallet-live-event.json \
            http://127.0.0.1:3000/api/integrations/work-wallet/events)
          test "$live_event_status" = "202"

          unauthorised_context_status=$(curl --silent --show-error --output /tmp/live-context-unauthorised.json --write-out '%{http_code}' \
            'http://127.0.0.1:3000/api/integrations/work-wallet/context?projectId=halifax-demo&sourceRecord=PER-201')
          test "$unauthorised_context_status" = "401"

          curl --fail --silent --show-error \
            --header 'X-Nexus-Integration-Key: ci-integration-key' \
            'http://127.0.0.1:3000/api/integrations/work-wallet/context?projectId=halifax-demo&sourceRecord=PER-201' \
            > /tmp/live-context.json
          grep '"nexusNodeId":"t-fire"' /tmp/live-context.json > /dev/null
          grep '"developmentContext":false' /tmp/live-context.json > /dev/null
          grep '"verificationSource":"WORK_WALLET"' /tmp/live-context.json > /dev/null
          ! grep '"title"' /tmp/live-context.json > /dev/null
          ! grep '"detail"' /tmp/live-context.json > /dev/null

      - name: Upload Nexus build
        uses: actions/upload-artifact@v4
        with:
          name: nosmo-nexus-web
          path: artifacts/nosmo-nexus/dist/public
          if-no-files-found: error
          retention-days: 14
