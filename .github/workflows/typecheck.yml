name: Validate and Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Nexus Google Drive routing
        run: |
          node scripts/src/validate-nexus-google-drive-routing.mjs
          pnpm --filter @workspace/scripts exec tsx ../artifacts/nosmo-nexus/src/cloud-data/validate-file-loader-drive-routing.ts

      - name: Validate Android Work Mode AI handoff receiver
        run: node scripts/src/validate-work-mode-ai-handoff.mjs

      - name: Typecheck workspace
        run: pnpm run typecheck

      - name: Build Nexus web application
        env:
          PORT: 4173
          BASE_PATH: /
        run: pnpm --filter @workspace/nosmo-nexus build

      - name: Smoke test production server, routes, Work Wallet API, Work Mode AI and Cloud Storage API
        env:
          PORT: 3000
          WORK_WALLET_DEMO_MODE: "true"
          NEXUS_WORK_MODE_AI_DEMO_MODE: "true"
          NEXUS_CLOUD_STORAGE_DEMO_MODE: "true"
          NEXUS_CLOUD_STORAGE_PROVIDER_KIND: "s3-compatible"
        run: |
          pnpm --filter @workspace/scripts serve-nexus > /tmp/nexus-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; cat /tmp/nexus-server.log' EXIT

          ready=0
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/health > /dev/null; then
              ready=1
              break
            fi
            sleep 0.5
          done

          test "$ready" = "1"
          curl --fail --silent --show-error http://127.0.0.1:3000/ > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:3000/modules > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:3000/workspace > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:3000/safety-connector > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:3000/safety-connector-demo > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:3000/electrical-commissioning/ > /dev/null

          curl --fail --silent --show-error \
            http://127.0.0.1:3000/api/integrations/work-wallet/status \
            | grep '"demoMode":true' > /dev/null

          cat > /tmp/work-wallet-event.json <<'JSON'
          {
            "id": "ci-work-wallet-event-001",
            "eventType": "INDUCTION_COMPLETED",
            "projectId": "HALIFAX-DEMO",
            "personId": "p2",
            "sourceRecord": "WW-IND-CI-001",
            "title": "Site induction completed",
            "detail": "Synthetic CI event"
          }
          JSON

          first_status=$(curl --silent --show-error --output /tmp/first-event.json --write-out '%{http_code}' \
            --header 'Content-Type: application/json' \
            --data @/tmp/work-wallet-event.json \
            http://127.0.0.1:3000/api/integrations/work-wallet/demo-events)
          test "$first_status" = "202"
          grep '"status":"accepted"' /tmp/first-event.json > /dev/null

          duplicate_status=$(curl --silent --show-error --output /tmp/duplicate-event.json --write-out '%{http_code}' \
            --header 'Content-Type: application/json' \
            --data @/tmp/work-wallet-event.json \
            http://127.0.0.1:3000/api/integrations/work-wallet/demo-events)
          test "$duplicate_status" = "200"
          grep '"status":"duplicate"' /tmp/duplicate-event.json > /dev/null

          curl --fail --silent --show-error \
            http://127.0.0.1:3000/api/integrations/work-wallet/demo-events \
            | grep 'ci-work-wallet-event-001' > /dev/null

          curl --fail --silent --show-error \
            http://127.0.0.1:3000/api/nexus/work-mode-ai/status \
            | grep '"providerBoundary":"server-side-orchestrator"' > /dev/null

          cat > /tmp/work-mode-ai-context.json <<'JSON'
          {
            "mode": "work",
            "client": "android-native",
            "surface": "ai-assistant",
            "intent": "ask-nexus",
            "aiContext": "android-work-discovery-v1",
            "project": "riverside",
            "acceptedSignals": 7,
            "prompt": "Use the Android Work Mode context to identify the active project, likely work package, missing evidence and immediate next action."
          }
          JSON

          work_mode_ai_status=$(curl --silent --show-error --output /tmp/work-mode-ai-response.json --write-out '%{http_code}' \
            --header 'Content-Type: application/json' \
            --data @/tmp/work-mode-ai-context.json \
            http://127.0.0.1:3000/api/nexus/work-mode-ai/context)
          test "$work_mode_ai_status" = "200"
          grep '"status":"accepted"' /tmp/work-mode-ai-response.json > /dev/null
          grep '"projectId":"RIVERSIDE_DEMO_PROJECT"' /tmp/work-mode-ai-response.json > /dev/null
          grep '"modelExecution":"disabled-demo-boundary"' /tmp/work-mode-ai-response.json > /dev/null

          curl --fail --silent --show-error \
            http://127.0.0.1:3000/api/nexus/cloud-storage/status \
            | grep '"providerBoundary":"nexus-api"' > /dev/null

          printf 'nexus cloud storage smoke\n' > /tmp/nexus-cloud-object.bin
          cloud_checksum=$(sha256sum /tmp/nexus-cloud-object.bin | awk '{print $1}')
          cloud_size=$(wc -c < /tmp/nexus-cloud-object.bin | tr -d ' ')
          cloud_metadata=$(CLOUD_SIZE="$cloud_size" CLOUD_CHECKSUM="$cloud_checksum" node -e 'const metadata = { scope: { projectId: "HALIFAX-DEMO", assetId: "nxs_asset_ci_cloud_001", fileId: "nxs_file_ci_cloud_001" }, objectKey: "ci-cloud-object-001", filename: "ci-photo.jpg", mimeType: "image/jpeg", sizeBytes: Number(process.env.CLOUD_SIZE), checksum: { algorithm: "sha256", value: process.env.CLOUD_CHECKSUM } }; process.stdout.write(encodeURIComponent(JSON.stringify(metadata)));')

          cloud_upload_status=$(curl --silent --show-error --output /tmp/cloud-upload.json --write-out '%{http_code}' \
            --request POST \
            --header "Content-Type: image/jpeg" \
            --header "X-Nexus-Storage-Metadata: $cloud_metadata" \
            --data-binary @/tmp/nexus-cloud-object.bin \
            http://127.0.0.1:3000/api/nexus/cloud-storage/objects)
          test "$cloud_upload_status" = "201"
          grep '"providerKind":"s3-compatible"' /tmp/cloud-upload.json > /dev/null
          grep "$cloud_checksum" /tmp/cloud-upload.json > /dev/null

          curl --fail --silent --show-error --get \
            --data-urlencode "projectId=HALIFAX-DEMO" \
            --data-urlencode "assetId=nxs_asset_ci_cloud_001" \
            --data-urlencode "fileId=nxs_file_ci_cloud_001" \
            --data-urlencode "objectKey=ci-cloud-object-001" \
            http://127.0.0.1:3000/api/nexus/cloud-storage/objects \
            --output /tmp/nexus-cloud-readback.bin
          cmp /tmp/nexus-cloud-object.bin /tmp/nexus-cloud-readback.bin

      - name: Upload Nexus build
        uses: actions/upload-artifact@v4
        with:
          name: nosmo-nexus-web
          path: artifacts/nosmo-nexus/dist/public
          if-no-files-found: error
          retention-days: 14