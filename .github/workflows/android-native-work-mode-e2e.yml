name: Build NEXUS Android Work Mode E2E

on:
  workflow_dispatch:
  push:
    branches:
      - codex/android-work-mode-e2e-handoff
    paths:
      - native/nexus-work-mode-native/**
      - src/core/android/**
      - src/core/permissions/canonicalAccessResolver.ts
      - artifacts/api-server/scripts/validate-android-authority-fixtures.ts
      - artifacts/api-server/src/routes/auth.ts
      - artifacts/api-server/src/routes/nexus-android-work-mode.ts
      - artifacts/api-server/src/middlewares/androidWorkModeRequestBoundary.ts
      - artifacts/api-server/src/lib/nexus-android-work-mode-authority.ts
      - artifacts/api-server/src/lib/nexus-person-binding.ts
      - lib/db/src/nexusProjectAccessPersistence.ts
      - lib/db/src/schema/nexusProjectMemoryIdentity.ts
      - lib/db/src/schema/nexusProjectAccess.ts
      - scripts/src/validate-android-mobile-cloud-flow.mjs
      - .github/workflows/android-native-work-mode-e2e.yml
  pull_request:
    branches:
      - codex/nexus-mvp-modular-foundation
    paths:
      - native/nexus-work-mode-native/**
      - src/core/android/**
      - src/core/permissions/canonicalAccessResolver.ts
      - artifacts/api-server/scripts/validate-android-authority-fixtures.ts
      - artifacts/api-server/src/routes/auth.ts
      - artifacts/api-server/src/routes/nexus-android-work-mode.ts
      - artifacts/api-server/src/middlewares/androidWorkModeRequestBoundary.ts
      - artifacts/api-server/src/lib/nexus-android-work-mode-authority.ts
      - artifacts/api-server/src/lib/nexus-person-binding.ts
      - lib/db/src/nexusProjectAccessPersistence.ts
      - lib/db/src/schema/nexusProjectMemoryIdentity.ts
      - lib/db/src/schema/nexusProjectAccess.ts
      - scripts/src/validate-android-mobile-cloud-flow.mjs
      - .github/workflows/android-native-work-mode-e2e.yml

permissions:
  contents: read

jobs:
  build-native-work-mode:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck workspace
        run: pnpm run typecheck

      - name: Execute canonical Android authority fixtures
        run: |
          pnpm --filter @workspace/api-server exec esbuild scripts/validate-android-authority-fixtures.ts \
            --bundle --platform=node --format=esm \
            --outfile=/tmp/nexus-android-authority-fixtures.mjs
          node /tmp/nexus-android-authority-fixtures.mjs

      - name: Validate Android auth, evidence and Cloud source boundaries
        run: node scripts/src/validate-android-mobile-cloud-flow.mjs

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK and release AAB
        working-directory: native/nexus-work-mode-native
        run: gradle :app:assembleDebug :app:bundleRelease --no-daemon --stacktrace

      - name: Verify APK security and canonical Android Cloud endpoint
        shell: bash
        run: |
          set -euo pipefail
          APK="native/nexus-work-mode-native/app/build/outputs/apk/debug/app-debug.apk"
          MANIFEST="native/nexus-work-mode-native/app/src/main/AndroidManifest.xml"
          CLOUD_CLIENT="native/nexus-work-mode-native/app/src/main/java/tech/nosmo/nexus/workmode/NexusCloudUploadClient.java"

          test -f "$APK"
          unzip -l "$APK" | grep -q "classes.dex"

          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -n "$AAPT"
          "$AAPT" dump badging "$APK" | tee /tmp/badging.txt
          "$AAPT" dump permissions "$APK" | tee /tmp/permissions.txt

          grep -q "package: name='tech.nosmo.nexus.workmode.nativebeta'" /tmp/badging.txt
          grep -q "android.permission.INTERNET" /tmp/permissions.txt
          grep -q "android.permission.READ_CONTACTS" /tmp/permissions.txt
          grep -q "android.permission.READ_CALENDAR" /tmp/permissions.txt

          ! grep -q "android.permission.MANAGE_EXTERNAL_STORAGE" /tmp/permissions.txt
          ! grep -q "android.permission.READ_EXTERNAL_STORAGE" /tmp/permissions.txt
          ! grep -q "android.permission.WRITE_EXTERNAL_STORAGE" /tmp/permissions.txt
          ! grep -q "android.permission.QUERY_ALL_PACKAGES" /tmp/permissions.txt
          ! grep -q "android.permission.SYSTEM_ALERT_WINDOW" /tmp/permissions.txt
          ! grep -q "android.permission.BIND_ACCESSIBILITY_SERVICE" /tmp/permissions.txt

          grep -q 'usesCleartextTraffic="false"' "$MANIFEST"
          grep -q '"/api/nexus/cloud/android/files"' "$CLOUD_CLIENT"
          ! grep -q '"/api/nexus/cloud/files"' "$CLOUD_CLIENT"

      - name: Prepare downloadable Android build
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[device-artifact]'))
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android-work-mode-e2e
          cp native/nexus-work-mode-native/app/build/outputs/apk/debug/app-debug.apk \
            android-work-mode-e2e/NEXUS-Work-Mode-v0.6.0-e2e-handoff.apk
          cp native/nexus-work-mode-native/app/build/outputs/bundle/release/app-release.aab \
            android-work-mode-e2e/NEXUS-Work-Mode-v0.6.0-e2e-handoff.aab
          sha256sum android-work-mode-e2e/* > android-work-mode-e2e/SHA256SUMS.txt
          cp /tmp/badging.txt android-work-mode-e2e/APK_BADGING.txt
          cp /tmp/permissions.txt android-work-mode-e2e/APK_PERMISSIONS.txt

      - name: Upload Android Work Mode build
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[device-artifact]'))
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Work-Mode-v0.6.0-e2e-handoff
          path: android-work-mode-e2e/*
          if-no-files-found: error
          retention-days: 1
