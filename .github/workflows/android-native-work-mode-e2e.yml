name: Build NEXUS Android Work Mode E2E

on:
  workflow_dispatch:
  push:
    branches:
      - codex/android-work-mode-e2e-handoff
      - codex/android-work-mode-home-nexus-tile
      - codex/android-core-recipient-projection-v3
      - codex/android-nexus-worker-home
    paths:
      - native/nexus-work-mode-native/**
      - src/core/android/**
      - src/core/permissions/canonicalAccessResolver.ts
      - artifacts/api-server/scripts/validate-android-authority-fixtures.ts
      - artifacts/api-server/src/routes/auth.ts
      - artifacts/api-server/src/routes/nexus-android-work-mode.ts
      - artifacts/api-server/src/middlewares/androidWorkModeRequestBoundary.ts
      - artifacts/api-server/src/lib/nexus-android-work-mode-authority.ts
      - artifacts/api-server/src/lib/nexus-person-binding.ts
      - lib/db/src/nexusProjectAccessPersistence.ts
      - lib/db/src/schema/nexusProjectMemoryIdentity.ts
      - lib/db/src/schema/nexusProjectAccess.ts
      - scripts/src/validate-android-mobile-cloud-flow.mjs
      - .github/workflows/android-native-work-mode-e2e.yml
  pull_request:
    branches:
      - codex/nexus-mvp-modular-foundation
    paths:
      - native/nexus-work-mode-native/**
      - src/core/android/**
      - src/core/permissions/canonicalAccessResolver.ts
      - artifacts/api-server/scripts/validate-android-authority-fixtures.ts
      - artifacts/api-server/src/routes/auth.ts
      - artifacts/api-server/src/routes/nexus-android-work-mode.ts
      - artifacts/api-server/src/middlewares/androidWorkModeRequestBoundary.ts
      - artifacts/api-server/src/lib/nexus-android-work-mode-authority.ts
      - artifacts/api-server/src/lib/nexus-person-binding.ts
      - lib/db/src/nexusProjectAccessPersistence.ts
      - lib/db/src/schema/nexusProjectMemoryIdentity.ts
      - lib/db/src/schema/nexusProjectAccess.ts
      - scripts/src/validate-android-mobile-cloud-flow.mjs
      - .github/workflows/android-native-work-mode-e2e.yml

permissions:
  contents: read

jobs:
  build-native-work-mode:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck workspace
        run: pnpm run typecheck

      - name: Execute canonical Android authority fixtures
        run: |
          pnpm --filter @workspace/api-server exec esbuild scripts/validate-android-authority-fixtures.ts \
            --bundle --platform=node --format=esm \
            --outfile=/tmp/nexus-android-authority-fixtures.mjs
          node /tmp/nexus-android-authority-fixtures.mjs

      - name: Validate Android auth, evidence and Cloud source boundaries
        run: node scripts/src/validate-android-mobile-cloud-flow.mjs

      - name: Validate Nexus Worker Home and recipient projection contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          base = Path('native/nexus-work-mode-native/app/src/main/java/tech/nosmo/nexus/workmode')
          home = (base / 'WorkModeHomeActivity.java').read_text()
          client = (base / 'NexusCoreWorkClient.java').read_text()
          inbox = (base / 'WorkInboxActivity.java').read_text()
          gradle = Path('native/nexus-work-mode-native/app/build.gradle').read_text()
          manifest = Path('native/nexus-work-mode-native/app/src/main/AndroidManifest.xml')
          root = ET.parse(manifest).getroot()
          ns = '{http://schemas.android.com/apk/res/android}'

          activities = root.find('application').findall('activity')
          activity_names = {activity.attrib.get(ns + 'name') for activity in activities}
          launcher = []
          for activity in activities:
              name = activity.attrib.get(ns + 'name')
              for intent_filter in activity.findall('intent-filter'):
                  actions = {a.attrib.get(ns + 'name') for a in intent_filter.findall('action')}
                  categories = {c.attrib.get(ns + 'name') for c in intent_filter.findall('category')}
                  if 'android.intent.action.MAIN' in actions and 'android.intent.category.LAUNCHER' in categories:
                      launcher.append(name)

          assert launcher == ['.WorkModeHomeActivity'], launcher
          assert '.WorkInboxActivity' in activity_names

          home_required = [
              'Nexus Worker Home',
              'Current work',
              'Only what is assigned to this worker. No app launcher, no noise.',
              'NexusCoreWorkClient.loadInbox',
              'new Intent(this, WorkInboxActivity.class)',
              'new Intent(this, CloudEvidenceShortcutActivity.class)',
              'openNexusPath("/project-worlds/esafe")',
              'showPending("Documents")',
              'CHECKLISTS',
              'DOCUMENTS',
              'EVIDENCE',
              'PROJECT',
              'navButton("WORK"',
              'navButton("CAMERA"',
              'navButton("FILES"',
              'navButton("INBOX"',
              'navButton("NEXUS"',
              'setMinimumHeight(dp(92))',
              'setMinimumHeight(dp(48))',
              'No local or synthetic Work Package is shown',
          ]
          for marker in home_required:
              assert marker in home, marker

          for forbidden_launcher in ('WhatsApp', 'Gmail', 'Teams', 'Maps', 'Excel', 'Drive launcher'):
              assert forbidden_launcher not in home, forbidden_launcher

          lowered_home = home.lower()
          for forbidden in ('token=', 'access_token=', 'session=', 'credential='):
              assert forbidden not in lowered_home, forbidden

          assert '/api/nexus/core/work-inbox' in client
          assert '/start' in client and '/evidence' in client and '/finish' in client
          assert 'Authorization", "Bearer " + token' in client
          assert 'actorPerson' not in client
          assert 'participationId' not in client
          assert 'PermissionGrant' not in client
          assert 'AccessDecision' not in client

          inbox_required = [
              'Work Packages assigned to the bound Person',
              'No local Work Package store',
              'Human approval pending. Worker cannot self-approve.',
              'Refresh from Project Memory',
              'Start work',
              'Add evidence confirmation',
              'Finish work  →  human approval',
          ]
          for marker in inbox_required:
              assert marker in inbox, marker

          assert 'def previewPackageSegment = "p${previewSha}"' in gradle
          assert 'applicationIdSuffix ".preview.${previewPackageSegment}"' in gradle
          assert "System.getenv('GITHUB_SHA')" in gradle
          assert "versionName '0.7.0-worker-home'" in gradle
          print('ANDROID_NEXUS_WORKER_HOME_PASS')
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK and release AAB
        working-directory: native/nexus-work-mode-native
        run: gradle :app:assembleDebug :app:bundleRelease --no-daemon --stacktrace

      - name: Verify APK security and canonical Android Cloud endpoint
        shell: bash
        run: |
          set -euo pipefail
          APK="native/nexus-work-mode-native/app/build/outputs/apk/debug/app-debug.apk"
          MANIFEST="native/nexus-work-mode-native/app/src/main/AndroidManifest.xml"
          CLOUD_CLIENT="native/nexus-work-mode-native/app/src/main/java/tech/nosmo/nexus/workmode/NexusCloudUploadClient.java"
          PREVIEW_SEGMENT="p$(printf '%s' "$GITHUB_SHA" | tr '[:upper:]' '[:lower:]' | tr -cd 'a-z0-9' | cut -c1-8)"
          EXPECTED_PACKAGE="tech.nosmo.nexus.workmode.preview.${PREVIEW_SEGMENT}"
          EXPECTED_VERSION="0.7.0-worker-home-preview-${PREVIEW_SEGMENT}"
          test -f "$APK"
          unzip -l "$APK" | grep -q "classes.dex"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -n "$AAPT"
          "$AAPT" dump badging "$APK" | tee /tmp/badging.txt
          "$AAPT" dump permissions "$APK" | tee /tmp/permissions.txt
          grep -q "package: name='${EXPECTED_PACKAGE}'" /tmp/badging.txt
          grep -q "versionName='${EXPECTED_VERSION}'" /tmp/badging.txt
          grep -q "android.permission.INTERNET" /tmp/permissions.txt
          grep -q "android.permission.READ_CONTACTS" /tmp/permissions.txt
          grep -q "android.permission.READ_CALENDAR" /tmp/permissions.txt
          ! grep -q "android.permission.MANAGE_EXTERNAL_STORAGE" /tmp/permissions.txt
          ! grep -q "android.permission.READ_EXTERNAL_STORAGE" /tmp/permissions.txt
          ! grep -q "android.permission.WRITE_EXTERNAL_STORAGE" /tmp/permissions.txt
          ! grep -q "android.permission.QUERY_ALL_PACKAGES" /tmp/permissions.txt
          ! grep -q "android.permission.SYSTEM_ALERT_WINDOW" /tmp/permissions.txt
          ! grep -q "android.permission.BIND_ACCESSIBILITY_SERVICE" /tmp/permissions.txt
          grep -q 'usesCleartextTraffic="false"' "$MANIFEST"
          grep -q '"/api/nexus/cloud/android/files"' "$CLOUD_CLIENT"
          ! grep -q '"/api/nexus/cloud/files"' "$CLOUD_CLIENT"

      - name: Prepare downloadable Android build
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/codex/android-work-mode-home-nexus-tile' || github.ref == 'refs/heads/codex/android-core-recipient-projection-v3' || github.ref == 'refs/heads/codex/android-nexus-worker-home'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android-work-mode-e2e
          cp native/nexus-work-mode-native/app/build/outputs/apk/debug/app-debug.apk android-work-mode-e2e/NEXUS-Worker-Home-Preview.apk
          cp native/nexus-work-mode-native/app/build/outputs/bundle/release/app-release.aab android-work-mode-e2e/NEXUS-Worker-Home-v0.7.0.aab
          sha256sum android-work-mode-e2e/* > android-work-mode-e2e/SHA256SUMS.txt
          cp /tmp/badging.txt android-work-mode-e2e/APK_BADGING.txt
          cp /tmp/permissions.txt android-work-mode-e2e/APK_PERMISSIONS.txt

      - name: Upload Android Work Mode build
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/codex/android-work-mode-home-nexus-tile' || github.ref == 'refs/heads/codex/android-core-recipient-projection-v3' || github.ref == 'refs/heads/codex/android-nexus-worker-home'
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Worker-Home-Preview
          path: android-work-mode-e2e/*
          if-no-files-found: error
          retention-days: 1
