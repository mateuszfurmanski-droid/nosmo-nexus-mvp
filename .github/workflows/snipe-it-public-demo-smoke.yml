name: Snipe-IT Public Demo Smoke

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'scripts/snipe-it-public-demo-smoke.mjs'
      - '.github/workflows/snipe-it-public-demo-smoke.yml'
      - 'src/connectors/snipe-it/**'
      - 'artifacts/nosmo-nexus/src/adaptive-connectors/**'

permissions:
  contents: read

jobs:
  public-demo-read:
    if: github.head_ref == 'codex/snipe-it-public-demo-e2e'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Read one asset from official Snipe-IT public develop demo
        run: node scripts/snipe-it-public-demo-smoke.mjs
